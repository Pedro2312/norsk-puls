<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Norsk Puls</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0B1220;
    --surface: #111A2C;
    --border: #1B2438;
    --border2: #2A3348;
    --text: #EDEFF5;
    --muted: #8B93A7;
    --muted2: #5C6580;
    --green: #4ADE8C;
    --violet: #8B7FE8;
    --amber: #F0C168;
    --red: #EF6F6C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }

  h1 { font-size: 24px; font-weight: 600; margin: 0; }
  .aurora-text {
    background: linear-gradient(90deg, var(--green), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; }
  .level-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border2);
    border-radius: 999px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 24px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  #themeTabs {
    margin: 20px 0 0;
    border-bottom: none;
    padding-bottom: 0;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  #themeTabs .tab-btn { flex-shrink: 0; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: #151E33;
    color: var(--text);
    border-color: var(--border2);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .card-label { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .sentence { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
  .translation { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .btn-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .btn:hover { border-color: var(--violet); }
  .btn.listen:hover { border-color: var(--green); }
  .btn.listening { border-color: var(--green); color: var(--green); animation: pulseRing 1.4s infinite; }
  .btn.next { border: none; color: var(--violet); padding-left: 0; }

  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(74,222,140,0.45), 0 0 0 0 rgba(139,127,232,0.3); }
    70% { box-shadow: 0 0 0 14px rgba(74,222,140,0), 0 0 0 26px rgba(139,127,232,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,140,0), 0 0 0 0 rgba(139,127,232,0); }
  }

  .error-text { color: var(--red); font-size: 13px; margin-top: 12px; }
  .heard-block { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .heard-label { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .match-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .score-pill { font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-pill { font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid; }
  .feedback-text { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .note { font-size: 12px; color: var(--muted2); margin-top: 16px; line-height: 1.5; }

  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; }
  .field-label:first-of-type { margin-top: 0; }
  .text-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--bg);
    color: var(--text);
  }
  .text-input:focus { outline: none; border-color: var(--violet); }
  select.text-input { -webkit-appearance: none; appearance: none; }
  .custom-item-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .custom-item-row:last-child { border-bottom: none; }
  .del-btn {
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .del-btn:hover { opacity: 1; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .opt-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .opt-btn.correct { border-color: var(--green); background: rgba(74,222,140,0.1); }
  .opt-btn.wrong { border-color: var(--red); background: rgba(239,111,108,0.1); }
  .opt-btn.dim { border-color: var(--border); opacity: 0.5; }

  .center-card { text-align: center; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">

  </div>

  { id: 54, level: 1, theme: "trabalho", blank: "Kan du sjekke ___?", answer: "sikringen", pt: "Podes verificar o fusível?", options: ["sikringen", "lyset", "kabelen", "målet", "planen"] },

  { id: 56, level: 1, theme: "trabalho", blank: "Skiftet begynner klokka ___.", answer: "sju", pt: "O turno começa às sete.", options: ["sju", "åtte", "seks", "ni", "ti"] },
  { id: 57, level: 1, theme: "trabalho", blank: "Vær ___ med strøm!", answer: "forsiktig", pt: "Tem cuidado com a eletricidade!", options: ["forsiktig", "rask", "sterk", "høy", "stille"] },

const THEMES = [
  { id: "basico", label: "🗣️ Básico" },
  { id: "cumprimentos", label: "👋 Cumprimentos" },
  { id: "numeros", label: "🔢 Números" },
  { id: "restaurante", label: "🍽️ Restaurante" },
  { id: "trabalho", label: "🔧 Trabalho" },
];
const fullSentence = (item) => item.blank.replace("___", item.answer);

// ---------- Matching helpers ----------
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}
function wordSimilarity(a, b) {
  if (!a || !b) return 0;
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);
  return maxLen === 0 ? 1 : 1 - dist / maxLen;
}
function normalize(s) { return s.toLowerCase().replace(/[.,!?;:]/g, "").trim(); }
function compareSentences(target, heard) {
  const targetWords = normalize(target).split(/\s+/).filter(Boolean);
  const heardWords = normalize(heard).split(/\s+/).filter(Boolean);
  const results = targetWords.map((tw) => {
    let best = 0;
    for (const hw of heardWords) best = Math.max(best, wordSimilarity(tw, hw));
    return { word: tw, score: best };
  });
  const overall = results.length ? Math.round((results.reduce((s, r) => s + r.score, 0) / results.length) * 100) : 0;
  return { results, overall };
}

// ---------- Storage (localStorage — this runs as a standalone file, not a Claude artifact) ----------
const STORAGE_KEY = "norsk-puls-progress";
const CUSTOM_KEY = "norsk-puls-custom";
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { level: 1, history: [] };
  } catch { return { level: 1, history: [] }; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
}
function loadCustom() {
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveCustom(items) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(items)); } catch {}
}
let progress = loadProgress();
let customItems = loadCustom();

function allItems() { return ITEMS.concat(customItems); }

function getThemes() {
  const builtinIds = THEMES.map(t => t.id);
  const customThemeIds = [...new Set(customItems.map(i => i.theme))].filter(id => !builtinIds.includes(id));
  const customThemes = customThemeIds.map(id => ({ id, label: "✨ " + id.charAt(0).toUpperCase() + id.slice(1) }));
  return THEMES.concat(customThemes);
}

// Builds multiple-choice options for an item. Built-in items already ship with
// curated distractors; custom items only have an answer, so we auto-generate
// plausible wrong answers by sampling other answers from the same theme.
function optionsFor(item) {
  if (item.options && item.options.length >= 2) return shuffle(item.options);
  const others = allItems().filter(i => i.answer.toLowerCase() !== item.answer.toLowerCase());
  const sameTheme = others.filter(i => i.theme === item.theme);
  const source = sameTheme.length >= 4 ? sameTheme : others;
  const seen = new Set([item.answer.toLowerCase()]);
  const distractors = [];
  for (const i of shuffle(source)) {
    const val = i.answer;
    if (!seen.has(val.toLowerCase())) {
      seen.add(val.toLowerCase());
      distractors.push(val);
    }
    if (distractors.length >= 4) break;
  }
  return shuffle([item.answer, ...distractors]);
}

// ---------- Speech ----------
function speak(text, onError) {
  if (!window.speechSynthesis) { onError && onError("A síntese de voz não é suportada neste navegador."); return; }
  const doSpeak = () => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "nb-NO";
    const voices = window.speechSynthesis.getVoices();
    const noVoice = voices.find(v => v.lang && (v.lang.toLowerCase().startsWith("nb") || v.lang.toLowerCase().startsWith("no")));
    if (noVoice) utter.voice = noVoice;
    utter.rate = 0.9;
    utter.onerror = () => onError && onError("Não foi possível reproduzir o áudio.");
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  };
  const existing = window.speechSynthesis.getVoices();
  if (existing.length > 0) doSpeak();
  else {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; doSpeak(); };
    setTimeout(doSpeak, 300);
  }
}
function getRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = "nb-NO";
  rec.interimResults = true;
  rec.continuous = false;
  return rec;
}

// ---------- State ----------
let currentTab = "practice";
let currentTheme = "basico";
let practiceIdx = 0, exerciseIdx = 0, exerciseScore = { correct: 0, total: 0 }, exerciseOptions = null;
let listening = false, heard = "", result = null, micError = "";
let recInstance = null;
let exSelected = null;
let testState = { running: false, set: [], idx: 0, selected: null, tally: 0, finished: false, lastScore: null };

function pool() { return allItems().filter(i => i.theme === currentTheme); }

function renderThemeTabs() {
  const el = document.getElementById("themeTabs");
  const themes = getThemes();
  el.innerHTML = themes.map(t =>
    `<button class="tab-btn ${t.id === currentTheme ? "active" : ""}" data-theme="${t.id}">${t.label}</button>`
  ).join("");
  el.querySelectorAll(".tab-btn").forEach(b => {
    b.onclick = () => {
      if (b.dataset.theme === currentTheme) return;
      currentTheme = b.dataset.theme;
      practiceIdx = 0; heard = ""; result = null; micError = ""; listening = false;
      exerciseIdx = 0; exSelected = null; exerciseOptions = null; exerciseScore = { correct: 0, total: 0 };
      testState = { running: false, set: [], idx: 0, selected: null, currentOptions: null, tally: 0, finished: false, lastScore: null };
      render();
    };
  });
}

// ---------- Render ----------
function render() {
  document.getElementById("levelBadge").textContent = `nível ${progress.level} / 3`;
  renderThemeTabs();
  document.querySelectorAll("#mainTabs .tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
  const el = document.getElementById("content");
  if (currentTab === "practice") el.innerHTML = renderPractice();
  else if (currentTab === "exercises") el.innerHTML = renderExercises();
  else if (currentTab === "test") el.innerHTML = renderTest();
  else el.innerHTML = renderAdd();
  attachHandlers();
}

function renderPractice() {
  const p = pool();

  if (practiceIdx >= p.length) {
    return `
      <div class="card center-card">
        <p class="display" style="font-size:20px;font-weight:600;margin:8px 0">Praticaste todas as ${p.length} frases deste nível! 🎉</p>
        <p class="translation" style="margin-bottom:24px">Podes repetir para reforçar, ou passar aos exercícios / teste semanal.</p>
        <button class="btn" id="btnRestartPractice" style="margin:0 auto">↺ Recomeçar</button>
      </div>`;
  }

  const item = p[practiceIdx];
  const target = fullSentence(item);
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  let heardBlock = "";
  if (heard) {
    let pillsHtml = "", scoreHtml = "", feedbackHtml = "";
    if (result) {
      const c = result.overall >= 80 ? "var(--green)" : result.overall >= 50 ? "var(--amber)" : "var(--red)";
      scoreHtml = `<div class="match-row">correspondência: <span class="score-pill" style="color:${c};border-color:${c}">${result.overall}%</span></div>`;
      pillsHtml = `<div class="pills">` + result.results.map(r => {
        const bg = r.score >= 0.8 ? "rgba(74,222,140,0.18)" : r.score >= 0.5 ? "rgba(240,193,104,0.18)" : "rgba(239,111,108,0.18)";
        const border = r.score >= 0.8 ? "var(--green)" : r.score >= 0.5 ? "var(--amber)" : "var(--red)";
        return `<span class="word-pill" style="background:${bg};border-color:${border}">${r.word}</span>`;
      }).join("") + `</div>`;
      const msg = result.overall >= 80 ? "Muito bem! Pronúncia sólida." : result.overall >= 50 ? "Está no bom caminho — repete devagar as palavras a amarelo/vermelho." : "Ouve a frase outra vez e tenta repetir palavra a palavra.";
      feedbackHtml = `<p class="feedback-text">${msg}</p>`;
    }
    heardBlock = `<div class="heard-block"><p class="heard-label">ouvi: <span style="color:var(--text)">${heard}</span></p>${scoreHtml}${pillsHtml}${feedbackHtml}</div>`;
  }

  return `
    <div class="card">
      <p class="card-label mono">frase ${practiceIdx + 1} de ${p.length}</p>
      <p class="sentence display">${target}</p>
      <p class="translation">${item.pt}</p>
      <div class="btn-row">
        <button class="btn listen" id="btnOuvir">🔊 Ouvir</button>
        ${supported
          ? `<button class="btn ${listening ? "listening" : ""}" id="btnFalar">🎙️ ${listening ? "A ouvir... (toca para parar)" : "Falar"}</button>`
          : `<span class="error-text">reconhecimento de voz não suportado neste navegador</span>`}
      </div>
      ${micError ? `<p class="error-text">${micError}</p>` : ""}
      ${heardBlock}
      <button class="btn next" id="btnNext">Próxima frase →</button>
    </div>
    <p class="note">Nota: a pontuação compara o que o reconhecimento de voz percebeu com a frase-alvo — é um bom indicador para começar, mas ainda não é uma análise fonética completa.</p>
  `;
}

function renderExercises() {
  const p = pool();

  if (exerciseIdx >= p.length) {
    const pct = exerciseScore.total ? Math.round((exerciseScore.correct / exerciseScore.total) * 100) : 0;
    return `
      <div class="card center-card">
        <p class="display" style="font-size:28px;font-weight:600;margin:8px 0">${pct}%</p>
        <p class="translation" style="margin-bottom:24px">Completaste os ${p.length} exercícios deste nível — ${exerciseScore.correct}/${exerciseScore.total} certas.</p>
        <button class="btn" id="btnRestartEx" style="margin:0 auto">↺ Recomeçar</button>
      </div>`;
  }

  const item = p[exerciseIdx];
  if (!exerciseOptions) exerciseOptions = optionsFor(item);
  const optsHtml = exerciseOptions.map(opt => {
    const isCorrect = opt === item.answer;
    const isSelected = opt === exSelected;
    let cls = "opt-btn";
    if (exSelected) {
      if (isCorrect) cls += " correct";
      else if (isSelected) cls += " wrong";
      else cls += " dim";
    }
    return `<button class="${cls}" data-opt="${opt}">${opt}${exSelected && isCorrect ? " ✓" : ""}${exSelected && isSelected && !isCorrect ? " ✗" : ""}</button>`;
  }).join("");

  return `
    <div class="card">
      <div class="top-row">
        <p class="card-label mono" style="margin:0">exercício ${exerciseIdx + 1} de ${p.length}</p>
        <span class="mono" style="font-size:12px;color:var(--muted)">${exerciseScore.correct}/${exerciseScore.total} certas</span>
      </div>
      <p class="sentence display">${item.blank}</p>
      <p class="translation">${item.pt}</p>
      <div class="options">${optsHtml}</div>
      ${exSelected ? `<button class="btn next" id="btnExNext" style="margin-top:20px">Próxima →</button>` : ""}
    </div>
  `;
}

function renderTest() {
  if (testState.finished) {
    const s = testState.lastScore;
    const msg = s >= 80 ? "Excelente! Já dominas bem esta matéria." : s >= 50 ? "Bom trabalho — vale a pena reforçar mais um pouco." : "Sem problema, ainda estás a começar. Volta à prática e tenta outra vez quando quiseres.";
    return `
      <div class="card center-card">
        <p class="display" style="font-size:28px;font-weight:600;margin:8px 0">${s}%</p>
        <p class="translation" style="margin-bottom:24px">${msg}</p>
        <button class="btn" id="btnRestartTest" style="margin:0 auto">↺ Repetir teste</button>
      </div>`;
  }
  if (!testState.running) {
    return `
      <div class="card center-card">
        <p class="translation">${progress.history.length === 0 ? "Ainda não fizeste nenhum teste." : `Testes feitos: ${progress.history.length}`}</p>
        <p class="translation" style="margin-bottom:24px">Faz quantos testes quiseres, quando quiseres — é só para veres o teu progresso.</p>
        <button class="btn" id="btnStartTest" style="margin:0 auto">Começar teste →</button>
      </div>`;
  }
  const item = testState.set[testState.idx];
  if (!testState.currentOptions) testState.currentOptions = optionsFor(item);
  const optsHtml = testState.currentOptions.map(opt => {
    const isCorrect = opt === item.answer;
    const isSelected = opt === testState.selected;
    let cls = "opt-btn";
    if (testState.selected) {
      if (isCorrect) cls += " correct";
      else if (isSelected) cls += " wrong";
      else cls += " dim";
    }
    return `<button class="${cls}" data-opt="${opt}">${opt}${testState.selected && isCorrect ? " ✓" : ""}${testState.selected && isSelected && !isCorrect ? " ✗" : ""}</button>`;
  }).join("");
  return `
    <div class="card">
      <p class="card-label mono">pergunta ${testState.idx + 1} de ${testState.set.length}</p>
      <p class="sentence display">${item.blank}</p>
      <p class="translation">${item.pt}</p>
      <div class="options">${optsHtml}</div>
      ${testState.selected ? `<button class="btn next" id="btnTestNext" style="margin-top:20px">${testState.idx + 1 < testState.set.length ? "Próxima" : "Ver resultado"} →</button>` : ""}
    </div>`;
}

// ---------- Handlers ----------
function attachHandlers() {
  if (currentTab === "practice") {
    const btnOuvir = document.getElementById("btnOuvir");
    if (btnOuvir) btnOuvir.onclick = () => {
      const p = pool(); const item = p[practiceIdx];
      speak(fullSentence(item), (msg) => { micError = msg; render(); });
    };
    const btnFalar = document.getElementById("btnFalar");
    if (btnFalar) btnFalar.onclick = () => { listening ? stopListening() : startListening(); };
    const btnNext = document.getElementById("btnNext");
    if (btnNext) btnNext.onclick = () => {
      practiceIdx++; heard = ""; result = null; micError = "";
      render();
    };
    const btnRestartPractice = document.getElementById("btnRestartPractice");
    if (btnRestartPractice) btnRestartPractice.onclick = () => {
      practiceIdx = 0; heard = ""; result = null; micError = "";
      render();
    };
  }
  if (currentTab === "exercises") {
    document.querySelectorAll(".options .opt-btn").forEach(b => {
      b.onclick = () => {
        if (exSelected) return;
        exSelected = b.dataset.opt;
        const p = pool(); const item = p[exerciseIdx];
        exerciseScore.total++;
        if (exSelected === item.answer) exerciseScore.correct++;
        render();
      };
    });
    const btnExNext = document.getElementById("btnExNext");
    if (btnExNext) btnExNext.onclick = () => { exerciseIdx++; exSelected = null; exerciseOptions = null; render(); };
    const btnRestartEx = document.getElementById("btnRestartEx");
    if (btnRestartEx) btnRestartEx.onclick = () => { exerciseIdx = 0; exSelected = null; exerciseOptions = null; exerciseScore = { correct: 0, total: 0 }; render(); };
  }
  if (currentTab === "test") {
    const btnStart = document.getElementById("btnStartTest");
    if (btnStart) btnStart.onclick = () => startTest();
    const btnRestart = document.getElementById("btnRestartTest");
    if (btnRestart) btnRestart.onclick = () => startTest();
    document.querySelectorAll(".options .opt-btn").forEach(b => {
      b.onclick = () => {
        if (testState.selected) return;
        testState.selected = b.dataset.opt;
        const item = testState.set[testState.idx];
        if (testState.selected === item.answer) testState.tally++;
        render();
      };
    });
    const btnTestNext = document.getElementById("btnTestNext");
    if (btnTestNext) btnTestNext.onclick = () => {
      if (testState.idx + 1 < testState.set.length) { testState.idx++; testState.selected = null; testState.currentOptions = null; render(); }
      else finishTest();
    };
  }
  if (currentTab === "add") {
    const themeSelect = document.getElementById("addThemeSelect");
    const newThemeInput = document.getElementById("addNewTheme");
    if (themeSelect) themeSelect.onchange = () => {
      newThemeInput.style.display = themeSelect.value === "__new__" ? "block" : "none";
    };
    const btnSubmit = document.getElementById("btnAddSubmit");
    if (btnSubmit) btnSubmit.onclick = () => {
      const sentenceEl = document.getElementById("addSentence");
      const answerEl = document.getElementById("addAnswer");
      const ptEl = document.getElementById("addPt");
      const errorEl = document.getElementById("addError");
      let sentence = sentenceEl.value.trim();
      const answer = answerEl.value.trim();
      const pt = ptEl.value.trim();
      let theme = themeSelect.value;
      if (theme === "__new__") theme = newThemeInput.value.trim().toLowerCase().replace(/\s+/g, "-");

      if (!answer || !pt || !theme) {
        errorEl.textContent = "Preenche pelo menos a resposta, a tradução e o tema.";
        errorEl.style.display = "block";
        return;
      }
      if (!sentence) sentence = "___";
      else if (!sentence.includes("___")) sentence = sentence + " ___";

      customItems.push({ id: "c-" + Date.now(), level: 1, theme, blank: sentence, answer, pt });
      saveCustom(customItems);
      currentTheme = theme;
      render();
    };
    document.querySelectorAll(".del-btn").forEach(b => {
      b.onclick = () => {
        customItems = customItems.filter(i => i.id !== b.dataset.id);
        saveCustom(customItems);
        render();
      };
    });
    const btnImport = document.getElementById("btnImport");
    if (btnImport) btnImport.onclick = () => {
      const box = document.getElementById("importBox");
      const errEl = document.getElementById("importError");
      const okEl = document.getElementById("importSuccess");
      errEl.style.display = "none";
      okEl.style.display = "none";
      const lines = box.value.split("\n").map(l => l.trim()).filter(Boolean);
      if (!lines.length) {
        errEl.textContent = "Cola pelo menos uma linha no formato indicado.";
        errEl.style.display = "block";
        return;
      }
      let added = 0, skipped = 0, lastTheme = null;
      lines.forEach((line, i) => {
        const parts = line.split("|").map(p => p.trim());
        if (parts.length < 4) { skipped++; return; }
        let [sentence, answer, pt, theme] = parts;
        if (!answer || !pt || !theme) { skipped++; return; }
        theme = theme.toLowerCase().replace(/\s+/g, "-");
        if (!sentence) sentence = "___";
        else if (!sentence.includes("___")) sentence = sentence + " ___";
        customItems.push({ id: "c-" + Date.now() + "-" + i, level: 1, theme, blank: sentence, answer, pt });
        added++;
        lastTheme = theme;
      });
      saveCustom(customItems);
      if (added > 0) {
        okEl.textContent = `${added} item(ns) importado(s)${skipped ? `, ${skipped} linha(s) ignorada(s) por formato inválido` : ""}.`;
        okEl.style.display = "block";
        box.value = "";
        if (lastTheme) currentTheme = lastTheme;
        render();
      } else {
        errEl.textContent = "Não consegui ler nenhuma linha — confirma que usas o separador \"|\" com 4 partes.";
        errEl.style.display = "block";
      }
    };
  }
}

function startListening() {
  const rec = getRecognition();
  if (!rec) { render(); return; }
  recInstance = rec;
  heard = ""; result = null; micError = ""; listening = true;
  render();
  rec.onresult = (e) => {
    let transcript = "";
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    heard = transcript;
    render();
  };
  rec.onerror = (e) => {
    listening = false;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") micError = "Permissão de microfone negada. Verifica as permissões do navegador.";
    else if (e.error === "no-speech") micError = "Não ouvi nada. Tenta falar mais perto do microfone.";
    else micError = "Não foi possível usar o microfone neste navegador.";
    render();
  };
  rec.onend = () => {
    listening = false;
    const p = pool(); const item = p[practiceIdx];
    if (heard) result = compareSentences(fullSentence(item), heard);
    render();
  };
  try { rec.start(); } catch { listening = false; micError = "Não foi possível iniciar o microfone."; render(); }
}
function stopListening() { if (recInstance) recInstance.stop(); }

function renderAdd() {
  const themes = getThemes();
  const currentThemeLabel = themes.find(t => t.id === currentTheme)?.label || currentTheme;
  const themeOptionsHtml = themes.map(t =>
    `<option value="${t.id}" ${t.id === currentTheme ? "selected" : ""}>${t.label}</option>`
  ).join("") + `<option value="__new__">✨ Novo tema...</option>`;

  const myItems = customItems.filter(i => i.theme === currentTheme);
  const listHtml = myItems.length
    ? myItems.map(i => `
        <div class="custom-item-row">
          <div>
            <p style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:14px">${i.blank.replace("___", `<b style="color:var(--violet)">${i.answer}</b>`)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${i.pt}</p>
          </div>
          <button class="del-btn" data-id="${i.id}" title="Remover">🗑</button>
        </div>`).join("")
    : `<p class="translation" style="margin:0">Ainda não adicionaste nada a este tema.</p>`;

  return `
    <div class="card">
      <p class="card-label mono">adicionar vocabulário ou frase</p>
      <label class="field-label">Frase em norueguês (usa ___ na palavra a testar, ou deixa vazio para praticar só a palavra)</label>
      <input class="text-input" id="addSentence" type="text" placeholder="Jeg ___ til jobb hver dag." />
      <label class="field-label">Palavra ou resposta correta</label>
      <input class="text-input" id="addAnswer" type="text" placeholder="kjører" />
      <label class="field-label">Tradução em português</label>
      <input class="text-input" id="addPt" type="text" placeholder="Eu conduzo para o trabalho todos os dias." />
      <label class="field-label">Tema</label>
      <select class="text-input" id="addThemeSelect">${themeOptionsHtml}</select>
      <input class="text-input" id="addNewTheme" type="text" placeholder="nome do novo tema (ex: família)" style="display:none;margin-top:8px" />
      <p class="error-text" id="addError" style="display:none;margin-top:12px"></p>
      <button class="btn" id="btnAddSubmit" style="margin-top:16px">➕ Adicionar</button>
    </div>
    <div class="card" style="margin-top:16px">
      <p class="card-label mono">os teus itens em "${currentThemeLabel}" (${myItems.length})</p>
      ${listHtml}
    </div>
    <div class="card" style="margin-top:16px">
      <p class="card-label mono">importar vocabulário em lote</p>
      <p class="translation" style="margin-bottom:12px">
        Útil para colar vocabulário que a Claude extraiu de um vídeo do YouTube ou de outro material. Um item por linha, neste formato:<br>
        <span class="mono" style="font-size:12px;color:var(--text)">frase com ___ | resposta | tradução em português | tema</span><br>
        <span class="mono" style="font-size:12px;color:var(--muted2)">Kan du sjekke ___? | sikringen | Podes verificar o fusível? | trabalho</span>
      </p>
      <textarea class="text-input" id="importBox" rows="6" style="resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:13px" placeholder="frase | resposta | tradução | tema"></textarea>
      <p class="error-text" id="importError" style="display:none;margin-top:12px"></p>
      <p class="feedback-text" id="importSuccess" style="display:none;color:var(--green)"></p>
      <button class="btn" id="btnImport" style="margin-top:16px">📥 Importar tudo</button>
    </div>
    <p class="note">O que adicionares aqui fica guardado neste telemóvel/navegador e entra automaticamente nos exercícios e na prática deste tema. As opções de escolha múltipla são geradas a partir de outras palavras do mesmo tema.</p>
  `;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startTest() {
  const p = pool();
  const size = Math.min(8, p.length);
  testState = { running: true, set: shuffle(p).slice(0, size), idx: 0, selected: null, currentOptions: null, tally: 0, finished: false, lastScore: null };
  render();
}
function finishTest() {
  const scorePct = Math.round((testState.tally / testState.set.length) * 100);
  let newLevel = progress.level;
  if (scorePct >= 80 && progress.level < 3) newLevel = progress.level + 1;
  progress.level = newLevel;
  progress.history.push({ date: new Date().toISOString(), score: scorePct, levelAfter: newLevel });
  saveProgress(progress);
  testState.finished = true; testState.running = false; testState.lastScore = scorePct;
  render();
}

// ---------- Tabs ----------
document.querySelectorAll("#mainTabs .tab-btn").forEach(btn => {
  btn.onclick = () => { currentTab = btn.dataset.tab; render(); };
});

render();
</script>
