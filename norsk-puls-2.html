        hintEl.textContent = `✅ Encontrei uma frase parecida já usada na app: "${bySentence.blank.replace("___", bySentence.answer)}"`;
      } else if (byWord) {
        answerEl.value = byWord;
        if (!sentenceEl.value) sentenceEl.value = "___";
        hintEl.textContent = `✅ Encontrei a palavra "${byWord}" no glossário da app.`;
      } else {
        hintEl.textContent = "🤷 Não encontrei nada parecido no vocabulário que a app já conhece. Escreve tu mesmo a frase em norueguês, ou pede a tradução à Claude no chat e cola aqui.";
      }
    };
    const btnSubmit = document.getElementById("btnAddSubmit");
    if (btnSubmit) btnSubmit.onclick = () => {
      const sentenceEl = document.getElementById("addSentence");
      const answerEl = document.getElementById("addAnswer");
      const ptEl = document.getElementById("addPt");
      const errorEl = document.getElementById("addError");
      const successEl = document.getElementById("addSuccess");
      errorEl.style.display = "none";
      successEl.style.display = "none";
      let sentence = sentenceEl.value.trim();
      const answer = answerEl.value.trim();
      const pt = ptEl.value.trim();
      let theme = themeSelect.value;
      if (theme === "__new__") theme = newThemeInput.value.trim().toLowerCase().replace(/\s+/g, "-");

      if (!answer || !pt || !theme) {
        errorEl.textContent = "Preenche pelo menos a resposta, a tradução e o tema.";
        errorEl.style.display = "block";
        return;
      }
      if (!sentence) sentence = "___";
      else if (!sentence.includes("___")) sentence = sentence + " ___";

      customItems.push({ id: "c-" + Date.now(), level: 1, theme, blank: sentence, answer, pt });
      saveCustom(customItems);
      currentTheme = theme;
      render();
      // feedback verde imediato — o render() acima já limpou o formulário (novo HTML),
      // por isso mostramos a confirmação depois de o DOM ser recriado.
      setTimeout(() => {
        const s = document.getElementById("addSuccess");
        if (s) { s.style.display = "block"; setTimeout(() => { if (s) s.style.display = "none"; }, 2500); }
      }, 0);
    };
    const btnClearAllCustom = document.getElementById("btnClearAllCustom");
    if (btnClearAllCustom) btnClearAllCustom.onclick = () => {
      if (!customItems.length) return;
      if (!confirm(`Isto vai apagar os ${customItems.length} itens que adicionaste ou importaste, em todos os temas. O conteúdo próprio da app não é afetado. Continuar?`)) return;
      customItems = [];
      saveCustom(customItems);
      render();
    };
    document.querySelectorAll(".del-btn").forEach(b => {
      b.onclick = () => {
        customItems = customItems.filter(i => i.id !== b.dataset.id);
        saveCustom(customItems);
        render();
      };
    });
    const btnImport = document.getElementById("btnImport");
    if (btnImport) btnImport.onclick = () => {
      const box = document.getElementById("importBox");
      const errEl = document.getElementById("importError");
      const okEl = document.getElementById("importSuccess");
      errEl.style.display = "none";
      okEl.style.display = "none";
      const entries = parseImportLines(box.value);
      if (!entries.length) {
        errEl.textContent = "Cola pelo menos uma linha no formato indicado.";
        errEl.style.display = "block";
        return;
      }
      let added = 0, withNotes = 0, unreadable = 0, dup = 0, lastTheme = null;
      const seenKeys = new Set(customItems.map(i => `${i.blank}|${i.answer}|${i.theme}`.toLowerCase()));
      entries.forEach((entry, i) => {
        const parsed = parseImportEntry(entry, currentTheme);
        if (!parsed) { unreadable++; return; }
        const key = `${parsed.sentence}|${parsed.answer}|${parsed.theme}`.toLowerCase();
        if (seenKeys.has(key)) { dup++; return; }
        seenKeys.add(key);
        customItems.push({ id: "c-" + Date.now() + "-" + i, level: 1, theme: parsed.theme, blank: parsed.sentence, answer: parsed.answer, pt: parsed.pt });
        added++;
        if (parsed.note) withNotes++;
        lastTheme = parsed.theme;
      });
      saveCustom(customItems);
      if (added > 0) {
        const total = entries.length;
        okEl.textContent = `✅ ${added} de ${total} frases adicionadas com sucesso!` +
          (withNotes ? ` (${withNotes} sem tema ou tradução completos — preenchidas com o tema atual)` : "") +
          (dup ? ` · ${dup} já existiam e foram ignoradas (sem duplicar).` : "") +
          (unreadable ? ` · ${unreadable} linha(s) sem dados suficientes para criar um exercício.` : "");
        okEl.style.display = "block";
        box.value = "";
        if (lastTheme) currentTheme = lastTheme;
        render();
      } else if (dup > 0 && unreadable === 0) {
        okEl.textContent = `Essas ${dup} frase(s) já estavam adicionadas — nada de novo para importar.`;
        okEl.style.display = "block";
        box.value = "";
      } else {
        errEl.textContent = "Não consegui ler nenhuma linha — confirma que usas o separador \"|\" entre os campos.";
        errEl.style.display = "block";
      }
    };
    const btnBackupGen = document.getElementById("btnBackupGen");
    if (btnBackupGen) btnBackupGen.onclick = () => {
      const backupBox = document.getElementById("backupBox");
      backupBox.value = customItems.length
        ? customItems.map(i => `${i.blank} | ${i.answer} | ${i.pt} | ${i.theme}`).join("\n")
        : "";
      if (!customItems.length) backupBox.placeholder = "Ainda não tens nenhum item guardado.";
    };
    const btnBackupCopy = document.getElementById("btnBackupCopy");
    if (btnBackupCopy) btnBackupCopy.onclick = () => {
      const backupBox = document.getElementById("backupBox");
      if (!backupBox.value) return;
      backupBox.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(backupBox.value).catch(() => { try { document.execCommand("copy"); } catch {} });
      } else {
        try { document.execCommand("copy"); } catch {}
      }
    };
    const btnRestore = document.getElementById("btnRestore");
    if (btnRestore) btnRestore.onclick = () => {
      const restoreBox = document.getElementById("restoreBox");
      const errEl = document.getElementById("restoreError");
      const okEl = document.getElementById("restoreSuccess");
      errEl.style.display = "none";
      okEl.style.display = "none";
      const entries = parseImportLines(restoreBox.value);
      if (!entries.length) {
        errEl.textContent = "Cola uma salvaguarda válida primeiro.";
        errEl.style.display = "block";
        return;
      }
      const existing = new Set(customItems.map(i => `${i.blank}|${i.answer}|${i.theme}`.toLowerCase()));
      let added = 0, dup = 0;
      entries.forEach((entry, i) => {
        const parsed = parseImportEntry(entry, currentTheme);
        if (!parsed) return;
        const key = `${parsed.sentence}|${parsed.answer}|${parsed.theme}`.toLowerCase();
        if (existing.has(key)) { dup++; return; }
        existing.add(key);
        customItems.push({ id: "c-" + Date.now() + "-r" + i, level: 1, theme: parsed.theme, blank: parsed.sentence, answer: parsed.answer, pt: parsed.pt });
        added++;
      });
      saveCustom(customItems);
      okEl.textContent = `✅ ${added} item(ns) restaurado(s)` + (dup ? `, ${dup} já existia(m) e foi(ram) ignorado(s)` : "") + ".";
      okEl.style.display = "block";
      restoreBox.value = "";
      render();
    };
  }
}

function startListening() {
  const rec = getRecognition();
  if (!rec) { render(); return; }
  recInstance = rec;
  heard = ""; result = null; micError = ""; listening = true;
  let lastConfidence = null;
  render();
  rec.onresult = (e) => {
    let transcript = "";
    for (let i = 0; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
      if (e.results[i].isFinal && typeof e.results[i][0].confidence === "number") {
        lastConfidence = e.results[i][0].confidence;
      }
    }
    heard = transcript;
    render();
  };
  rec.onerror = (e) => {
    listening = false;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") micError = "Permissão de microfone negada. Verifica as permissões do navegador.";
    else if (e.error === "no-speech") micError = "Não ouvi nada. Tenta falar mais perto do microfone.";
    else micError = "Não foi possível usar o microfone neste navegador.";
    render();
  };
  rec.onend = () => {
    listening = false;
    const p = pool(); const item = p[practiceIdx];
    // confiança 0 é um valor real do browser, por isso comparamos com null explicitamente
    if (heard) result = compareSentences(fullSentence(item), heard, lastConfidence === null ? undefined : lastConfidence);
    render();
  };
  try { rec.start(); } catch { listening = false; micError = "Não foi possível iniciar o microfone."; render(); }
}
function stopListening() { if (recInstance) recInstance.stop(); }

// ---------- Handwriting canvas (mouse, touch, and stylus via Pointer Events) ----------
function setupCanvas(canvas) {
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssHeight = 220;
  const cssWidth = canvas.getBoundingClientRect().width || canvas.parentElement.clientWidth;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#EDEFF5";

  let drawing = false;
  let last = null;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.onpointerdown = (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    last = pos(e);
    ctx.beginPath();
    ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  };
  canvas.onpointermove = (e) => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  };
  const stop = () => { drawing = false; };
  canvas.onpointerup = stop;
  canvas.onpointerleave = stop;
  canvas.onpointercancel = stop;
}

// ---------- Leitor de jornal: motor de reprodução ----------
function highlightNewsWord(sentIdx, wordIdx) {
  document.querySelectorAll(".news-word.active").forEach(el => el.classList.remove("active"));
  if (sentIdx == null || wordIdx == null || wordIdx < 0) return;
  const el = document.getElementById(`w-${sentIdx}-${wordIdx}`);
  if (el) {
    el.classList.add("active");
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}
function highlightNewsSentence(idx) {
  document.querySelectorAll(".news-sent-no.current-sentence").forEach(el => el.classList.remove("current-sentence"));
  const el = document.getElementById(`sent-${idx}`);
  if (el) { el.classList.add("current-sentence"); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function updateNewsPlayButton() {
  const btn = document.getElementById("btnNewsPlay");
  if (!btn) return;
  btn.textContent = !newsPlaying ? "▶️" : (newsPaused ? "▶️" : "⏸️");
  btn.title = !newsPlaying ? "Ler em voz alta" : (newsPaused ? "Continuar" : "Pausar");
}

function speakNewsSentence(idx) {
  const article = currentNewsArticle();
  if (!article) return;
  if (idx >= article.sentences.length) {
    newsPlaying = false; newsPaused = false; newsSentenceIdx = 0;
    highlightNewsWord(null, -1); highlightNewsSentence(-1);
    updateNewsPlayButton();
    return;
  }
  newsSentenceIdx = idx;
  const sent = article.sentences[idx];
  const words = sent.no.match(/\S+/g) || [];
  const utter = new SpeechSynthesisUtterance(sent.no);
  utter.lang = "nb-NO";
  const voices = window.speechSynthesis.getVoices();
  const chosen = voices.find(v => v.name === newsVoiceName)
    || voices.find(v => v.lang && /^nb/i.test(v.lang))
    || voices.find(v => v.lang && /^no/i.test(v.lang));
  if (chosen) utter.voice = chosen;
  utter.rate = newsRate;
  const map = buildWordMap(sent.no);

  // O destaque é conduzido por um horário ESTIMADO (palavras longas demoram
  // mais a dizer do que "og"/"er"/"på" — por isso o tempo por palavra é
  // proporcional ao nº de letras, não fixo). Isto evita o atraso que se
  // acumulava com frases cheias de palavras curtas seguidas.
  // Sempre que chega um evento real "boundary" do motor de voz, corrigimos
  // logo para essa posição e reagendamos o resto a partir dali — o horário
  // estimado nunca fica muito tempo a "adivinhar às cegas".
  let scheduled = [];
  const clearSchedule = () => { scheduled.forEach(t => clearTimeout(t)); scheduled = []; };
  const runSchedule = (fromWi) => {
    clearSchedule();
    if (!words.length) return;
    const charMs = 62 / Math.max(newsRate, 0.35);
    const minMs = 150 / Math.max(newsRate, 0.35);
    let delay = 0;
    for (let wi = fromWi; wi < words.length; wi++) {
      scheduled.push(setTimeout(() => highlightNewsWord(idx, wi), delay));
      delay += Math.max(minMs, words[wi].length * charMs);
    }
  };
  utter.onstart = () => runSchedule(0);
  utter.onboundary = (e) => {
    if (e.name && e.name !== "word") return; // ignora boundaries de frase noutros browsers
    let found = map.find(w => e.charIndex >= w.start && e.charIndex < w.end);
    if (!found) found = [...map].reverse().find(w => w.start <= e.charIndex);
    const wi = found ? found.idx : -1;
    if (wi >= 0) {
      highlightNewsWord(idx, wi);
      runSchedule(wi + 1);
    }
  };
  utter.onend = () => {
    clearSchedule();
    if (suppressNewsAdvance) { suppressNewsAdvance = false; return; }
    if (newsPlaying) speakNewsSentence(idx + 1);
  };
  utter.onerror = () => {
    clearSchedule();
    if (suppressNewsAdvance) { suppressNewsAdvance = false; return; }
    newsPlaying = false; newsPaused = false; updateNewsPlayButton();
  };
  highlightNewsSentence(idx);
  window.speechSynthesis.speak(utter);
}

function restartNewsSentence() {
  if (!newsPlaying || newsPaused) return;
  suppressNewsAdvance = true;
  window.speechSynthesis.cancel();
  speakNewsSentence(newsSentenceIdx);
}

function toggleNewsPlay() {
  if (!window.speechSynthesis) return;
  if (!newsPlaying) {
    newsPlaying = true; newsPaused = false;
    speakNewsSentence(newsSentenceIdx || 0);
  } else if (!newsPaused) {
    window.speechSynthesis.pause();
    newsPaused = true;
  } else {
    window.speechSynthesis.resume();
    newsPaused = false;
  }
  updateNewsPlayButton();
}

function stopNewsPlayback() {
  if (!window.speechSynthesis) return;
  suppressNewsAdvance = true;
  window.speechSynthesis.cancel();
  newsPlaying = false; newsPaused = false; newsSentenceIdx = 0;
  highlightNewsWord(null, -1); highlightNewsSentence(-1);
  updateNewsPlayButton();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startTest() {
  const p = groupPool(currentTheme);
  if (!p.length) { render(); return; } // tema sem frases suficientes — nada a fazer
  // Entre 15 e 20 perguntas por teste (limitado pelo tamanho da pool do tema).
  const target = 15 + Math.floor(Math.random() * 6);
  const size = Math.min(target, p.length);
  testState = { running: true, pool: p, set: shuffle(p).slice(0, size), idx: 0, selected: null, currentOptions: null, tally: 0, finished: false, lastScore: null };
  render();
}
function finishTest() {
  const scorePct = Math.round((testState.tally / testState.set.length) * 100);
  let newLevel = progress.level;
  if (scorePct >= 80 && progress.level < 3) newLevel = progress.level + 1;
  progress.level = newLevel;
  progress.history.push({ date: new Date().toISOString(), score: scorePct, levelAfter: newLevel });
  saveProgress(progress);
  testState.finished = true; testState.running = false; testState.lastScore = scorePct;
  render();
}

// ---------- Tabs ----------
document.querySelectorAll("#mainTabs .tab-btn").forEach(btn => {
  btn.onclick = () => {
    if (currentTab === "news" && btn.dataset.tab !== "news") stopNewsPlayback();
    currentTab = btn.dataset.tab;
    render();
  };
});

render();
</script>
<script>
  // Regista o service worker para a app funcionar offline e ficar instalável.
  // Se falhar (ex.: aberta em file:// em vez de https://), a app continua a
  // funcionar normalmente, só sem essas duas vantagens extra.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
