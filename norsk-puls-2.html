<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Norsk Puls</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B1220" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Norsk Puls" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0B1220;
    --surface: #111A2C;
    --border: #1B2438;
    --border2: #2A3348;
    --text: #EDEFF5;
    --muted: #8B93A7;
    --muted2: #5C6580;
    --green: #4ADE8C;
    --violet: #8B7FE8;
    --amber: #F0C168;
    --red: #EF6F6C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }

  h1 { font-size: 24px; font-weight: 600; margin: 0; }
  .aurora-text {
    background: linear-gradient(90deg, var(--green), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; }
  .level-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border2);
    border-radius: 999px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 24px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  #themeTabs {
    margin: 20px 0 0;
    border-bottom: none;
    padding-bottom: 0;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  #mainTabs {
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  #themeTabs .tab-btn, #mainTabs .tab-btn { flex-shrink: 0; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: #151E33;
    color: var(--text);
    border-color: var(--border2);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .card-label { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .sentence { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
  .translation { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .btn-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .btn:hover { border-color: var(--violet); }
  .btn.listen:hover { border-color: var(--green); }
  .btn.listening { border-color: var(--green); color: var(--green); animation: pulseRing 1.4s infinite; }
  .btn.next { border: none; color: var(--violet); padding-left: 0; }

  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(74,222,140,0.45), 0 0 0 0 rgba(139,127,232,0.3); }
    70% { box-shadow: 0 0 0 14px rgba(74,222,140,0), 0 0 0 26px rgba(139,127,232,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,140,0), 0 0 0 0 rgba(139,127,232,0); }
  }

  .canvas-wrap {
    border: 1px solid var(--border2);
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
    background: #0e1626;
    margin: 4px 0 16px;
  }
  .canvas-wrap canvas { display: block; width: 100%; height: 220px; }

  .gloss-block {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .gloss-line {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .gloss-line b { color: var(--text); }

  .error-text { color: var(--red); font-size: 13px; margin-top: 12px; }
  .heard-block { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
  .phon-toggle {
    font-size: 12px;
    padding: 5px 10px;
    color: var(--violet);
    border-color: var(--border2);
  }
  .heard-label { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .match-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .score-pill { font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-pill { font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid; }
  .feedback-text { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .note { font-size: 12px; color: var(--muted2); margin-top: 16px; line-height: 1.5; }

  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; }
  .field-label:first-of-type { margin-top: 0; }
  .text-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--bg);
    color: var(--text);
  }
  .text-input:focus { outline: none; border-color: var(--violet); }
  select.text-input { -webkit-appearance: none; appearance: none; }
  .custom-item-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .custom-item-row:last-child { border-bottom: none; }
  .del-btn {
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .del-btn:hover { opacity: 1; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .opt-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .opt-btn.correct { border-color: var(--green); background: rgba(74,222,140,0.1); animation: popIn 0.25s ease; }
  .opt-btn.wrong { border-color: var(--red); background: rgba(239,111,108,0.1); animation: popIn 0.25s ease; }
  .opt-btn.dim { border-color: var(--border); opacity: 0.5; }

  /* ---- Exercícios: construir a frase (word bank / chips, estilo Duolingo) ---- */
  .word-bank-container { margin-bottom: 16px; }
  .sentence-builder-target {
    min-height: 50px;
    border-bottom: 2px solid var(--border2);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px;
    align-items: center;
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .word-bank-pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-chip {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-bottom: 3px solid var(--border2); /* Efeito 3D típico do Duolingo */
    color: var(--text);
    padding: 8px 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.1s;
  }
  .word-chip:active {
    transform: translateY(2px);
    border-bottom-width: 1px;
  }
  .word-chip.used {
    opacity: 0.3;
    pointer-events: none;
  }
  .word-chip.correct { border-color: var(--green); background: rgba(74,222,140,0.1); animation: popIn 0.25s ease; }
  .word-chip.wrong { border-color: var(--red); background: rgba(239,111,108,0.1); animation: popIn 0.25s ease; }

  /* ---- Painel de feedback ao fundo (estilo Duolingo) ---- */
  .feedback-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface);
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 50;
    animation: slideUp 0.2s ease;
  }
  .feedback-sheet.hidden { display: none; }
  .feedback-sheet.correct { border-top: 2px solid var(--green); background: #0f2318; }
  .feedback-sheet.warn { border-top: 2px solid var(--amber); background: #2a2010; }
  .feedback-sheet.wrong { border-top: 2px solid var(--red); background: #2a1414; }
  .feedback-content { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .feedback-icon { font-size: 28px; line-height: 1; }
  .feedback-text-wrap h3 { margin: 0; font-size: 16px; font-family: 'Space Grotesk', sans-serif; }
  .feedback-sheet.correct .feedback-text-wrap h3 { color: var(--green); }
  .feedback-sheet.warn .feedback-text-wrap h3 { color: var(--amber); }
  .feedback-sheet.wrong .feedback-text-wrap h3 { color: var(--red); }
  .feedback-text-wrap p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .feedback-text-wrap p:empty { display: none; }
  .btn-continue {
    display: block; width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: 14px; letter-spacing: 0.03em;
  }
  .feedback-sheet.correct .btn-continue { background: var(--green); color: #0B1220; }
  .feedback-sheet.warn .btn-continue { background: var(--amber); color: #0B1220; }
  .feedback-sheet.wrong .btn-continue { background: var(--red); color: #0B1220; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes popIn {
    0% { transform: scale(0.94); }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @media (max-width: 380px) {
    .options { grid-template-columns: 1fr; }
  }
  #streakBadge {
    display: inline-flex;
    align-items: center;
    color: var(--amber);
    border-color: var(--amber);
  }

  /* ---- Exercícios: barra de progresso da sessão, pontos e dificuldade ---- */
  .session-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .session-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--border2); overflow: hidden; }
  .session-bar-fill { height: 100%; background: var(--amber); border-radius: 999px; transition: width 0.25s ease; }
  .session-points { font-size: 13px; color: var(--amber); white-space: nowrap; }
  .diff-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .diff-badge.easy { color: var(--green); }
  .diff-badge.medium { color: var(--amber); }
  .diff-badge.hard { color: var(--red); }
  .theme-progress { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted2); }
  .theme-progress.done { color: var(--green); }

  /* ---- Exercícios: emparelhar pares ---- */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .match-tile { text-align: center; width: 100%; }
  .match-tile.selected { border-color: var(--violet); background: rgba(139,127,232,0.12); }

  .center-card { text-align: center; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

  /* ---- Jornal / leitor de notícias ---- */
  .news-city-tabs { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; padding-bottom: 2px; }
  .news-city-tabs .tab-btn { flex-shrink: 0; }
  .news-article-picker { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; }
  .news-article-btn {
    flex-shrink: 0;
    max-width: 220px;
    text-align: left;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .news-article-btn.active { border-color: var(--violet); color: var(--text); background: #151E33; }
  .news-title { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .news-tag { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .news-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; }
  .news-icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 999px;
    border: 1px solid var(--border2); background: none; color: var(--text);
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .news-icon-btn.primary { border-color: var(--green); color: var(--green); }
  .news-select {
    flex: 1; min-width: 140px;
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 9px 10px;
    border-radius: 8px; border: 1px solid var(--border2); background: var(--bg); color: var(--text);
  }
  .news-speed-block { margin: 14px 0 4px; }
  .news-speed-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .news-speed-slider {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 999px;
    background: var(--border2); outline: none;
  }
  .news-speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--green); cursor: pointer; border: none;
  }
  .news-speed-slider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--green); cursor: pointer; border: none;
  }
  .news-body { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .news-sent-no {
    font-size: 16px; font-weight: 400; line-height: 1.65; margin: 0 0 3px;
    padding: 3px 6px; border-radius: 8px; transition: background 0.2s;
  }
  .news-sent-no.current-sentence { background: rgba(139,127,232,0.08); }
  .news-sent-pt { font-size: 13px; color: var(--muted); margin: 0 0 14px; padding: 0 6px; }
  .news-word { transition: background 0.1s, color 0.1s; border-radius: 4px; padding: 0 1px; }
  .news-word.active { background: var(--green); color: #0B1220; }
  .news-unsupported { color: var(--red); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1 class="display">Norsk <span class="aurora-text">Puls</span></h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="level-badge" id="streakBadge" style="display:none"></span>
      <button class="level-badge" id="levelBadge" style="cursor:pointer;font:inherit" data-tab="stats">nível 1 / 3</button>
    </div>
  </div>
  <p class="subtitle">Português → Norueguês (bokmål), com foco na pronúncia</p>

  <div class="tabs" id="themeTabs"></div>

  <div class="tabs" id="mainTabs">
    <button class="tab-btn" data-tab="news">📰 Jornal</button>
    <button class="tab-btn active" data-tab="practice">🎙️ Praticar</button>
    <button class="tab-btn" data-tab="write">✍️ Escrever</button>
    <button class="tab-btn" data-tab="exercises">📘 Exercícios</button>
    <button class="tab-btn" data-tab="test">🏆 Teste</button>
    <button class="tab-btn" data-tab="stats">📊 Progresso</button>
    <button class="tab-btn" data-tab="add">➕ Adicionar</button>
  </div>

  <div id="content"></div>
</div>

<script>
// ---------- Data ----------
const ITEMS = [
  // ---- Tema: básico (pronomes e perguntas) ----
  { id: 1, level: 1, theme: "basico", blank: "___ heter David.", answer: "Jeg", pt: "Eu chamo-me David.", fon: "Iei iéter Dávid.", options: ["Jeg", "Du", "Han", "Vi", "Dere"] },
  { id: 2, level: 1, theme: "basico", blank: "___ bor i Bergen.", answer: "Hun", pt: "Ela mora em Bergen.", fon: "Hün bur i Bérguen.", options: ["Hun", "Jeg", "De", "Dere", "Vi"] },
  { id: 3, level: 1, theme: "basico", blank: "___ er lærer.", answer: "Han", pt: "Ele é professor.", fon: "Han ér lérer.", options: ["Han", "Hun", "Jeg", "Vi", "De"] },
  { id: 4, level: 1, theme: "basico", blank: "___ snakker norsk.", answer: "Vi", pt: "Nós falamos norueguês.", fon: "Vi snáquer norrsk.", options: ["Vi", "Dere", "De", "Jeg", "Du"] },
  { id: 5, level: 1, theme: "basico", blank: "___ er fra Portugal.", answer: "Dere", pt: "Vocês são de Portugal.", fon: "Dêre ér frá Purtugál.", options: ["Dere", "Vi", "De", "Han", "Hun"] },
  { id: 6, level: 1, theme: "basico", blank: "___ heter du?", answer: "Hva", pt: "Como te chamas?", fon: "Vá iéter dü?", options: ["Hva", "Hvor", "Hvem", "Når", "Hvordan"] },
  { id: 7, level: 1, theme: "basico", blank: "___ er du fra?", answer: "Hvor", pt: "De onde és?", fon: "Vur ér dü frá?", options: ["Hvor", "Hva", "Hvem", "Hvorfor", "Når"] },
  { id: 8, level: 1, theme: "basico", blank: "___ er det?", answer: "Hvem", pt: "Quem é?", fon: "Vém ér dé?", options: ["Hvem", "Hva", "Hvor", "Når", "Hvordan"] },
  { id: 9, level: 1, theme: "basico", blank: "___ kommer toget?", answer: "Når", pt: "Quando chega o comboio?", fon: "Nór cómer tóguet?", options: ["Når", "Hvor", "Hvem", "Hva", "Hvordan"] },
  { id: 10, level: 1, theme: "basico", blank: "___ har du det i dag?", answer: "Hvordan", pt: "Como estás hoje?", fon: "Vúrdan hár dü dé i dág?", options: ["Hvordan", "Hvorfor", "Hva", "Hvem", "Når"] },
  { id: 11, level: 3, theme: "basico", blank: "Jeg ___ til Norge om seks måneder.", answer: "flytter", pt: "Eu mudo-me para a Noruega daqui a seis meses.", fon: "Iei flütter til Nórgue om secs móneder.", options: ["flytter", "bor", "jobber", "snakker", "heter"] },
  { id: 12, level: 3, theme: "basico", blank: "Hun ___ norsk hver dag.", answer: "øver", pt: "Ela pratica norueguês todos os dias.", fon: "Hün över norrsk vér dág.", options: ["øver", "spiser", "sover", "kjører", "leser"] },

  // ---- Tema: cumprimentos ----
  { id: 20, level: 1, theme: "cumprimentos", blank: "Hei, jeg ___ Pedro.", answer: "heter", pt: "Olá, chamo-me Pedro.", fon: "Hei, iei iéter Pédru.", options: ["heter", "er", "har", "bor", "jobber"] },
  { id: 21, level: 1, theme: "cumprimentos", blank: "Jeg kommer ___ Portugal.", answer: "fra", pt: "Eu venho de Portugal.", fon: "Iei cómer frá Purtugál.", options: ["fra", "til", "i", "på", "med"] },
  { id: 22, level: 1, theme: "cumprimentos", blank: "Hyggelig å ___ deg.", answer: "møte", pt: "Prazer em conhecer-te.", fon: "Hüguêli o mötə dei.", options: ["møte", "se", "høre", "snakke", "vite"] },
  { id: 23, level: 1, theme: "cumprimentos", blank: "Ha en fin ___!", answer: "dag", pt: "Tem um bom dia!", fon: "Ha en fin dág!", options: ["dag", "kveld", "uke", "jobb", "tur"] },
  { id: 24, level: 1, theme: "cumprimentos", blank: "Vi ___!", answer: "sees", pt: "Até à vista!", fon: "Vi sé-es!", options: ["sees", "snakkes", "møtes", "ringer", "går"] },
  { id: 25, level: 1, theme: "cumprimentos", blank: "___, takk.", answer: "Ja", pt: "Sim, por favor.", fon: "Iá, tak.", options: ["Ja", "Nei", "Kanskje", "Takk", "Vær"] },
  { id: 26, level: 1, theme: "cumprimentos", blank: "Unnskyld, jeg ___ ikke norsk så godt ennå.", answer: "kan", pt: "Desculpa, ainda não sei bem norueguês.", fon: "Ünnshüll, iei kan icke norrsk so gót ennó.", options: ["kan", "vil", "skal", "må", "har"] },

  // ---- Tema: números ----

// Prepara os blocos de palavras para os modos de "construir a frase":
// targetText é o texto certo a construir; wordPoolFn extrai as palavras de
// cada item candidato (fullSentence para norueguês, i.pt para português) —
// assim a mesma lógica serve o modo "Construir a frase", "Ditado" e "Ouvir
// e traduzir", só muda a língua-alvo dos blocos.
function initBuildFor(item, targetText, wordPoolFn) {
  const words = targetText.split(" ").filter(Boolean);
  const tiles = words.map((w, i) => ({ id: "w" + i, text: w }));
  const seen = new Set(words.map(w => w.toLowerCase()));
  const others = shuffle(groupPool(currentTheme).filter(i => i.id !== item.id));
  let added = 0;
  for (const o of others) {
    if (added >= 2) break;
    const ws = wordPoolFn(o).split(" ").filter(w => w && !seen.has(w.toLowerCase()));
    if (!ws.length) continue;
    const w = ws[Math.floor(Math.random() * ws.length)];
    seen.add(w.toLowerCase());
    tiles.push({ id: "d" + added, text: w });
    added++;
  }
  buildBank = shuffle(tiles);
  buildAnswer = [];
  buildChecked = false;
  buildWrong = false;
  buildGaveUp = false;
}
function initBuild(item) {
  initBuildFor(item, fullSentence(item), fullSentence);
  buildLastKey = "build:" + item.id;
}
function initListen(item) {
  initBuildFor(item, fullSentence(item), fullSentence);
  buildLastKey = "listen:" + item.id;
}
function initListenTranslate(item) {
  initBuildFor(item, item.pt, (o) => o.pt || "");
  buildLastKey = "listenTranslate:" + item.id;
}

// ---------- Modo: emparelhar pares ----------
// Escolhe pares português↔norueguês do tema atual. Primeiro tenta palavras
// isoladas (item.answer sem espaços); depois completa sempre com outras
// palavras das frases completas que já têm significado conhecido no
// glossário GLOSS — sem inventar vocabulário novo, só aproveitar todo o
// que já existe. A ronda usa TODO o vocabulário disponível no tema (até um
// teto de segurança de 40, só para nunca ficar absurdo em ecrãs pequenos);
// em temas pequenos aparecem naturalmente menos pares — é o conteúdo do
// tema que manda, não um limite artificial do código.
function setupMatch(theme) {
  const p = groupPool(theme);
  const seen = new Set();
  const candidates = [];
  function tryAdd(no, pt) {
    const key = no.toLowerCase();
    if (seen.has(key) || !pt) return;
    seen.add(key);
    candidates.push({ id: key, no, pt });
  }
  shuffle(p.slice()).forEach(i => {
    if (i.answer && !i.answer.includes(" ")) tryAdd(i.answer, glossFor(i.answer) || i.pt);
  });
  shuffle(p.slice()).forEach(i => {
    fullSentence(i).split(" ").forEach(w => {
      const clean = w.replace(/[.,!?;:]/g, "");
      if (clean.length < 2) return;
      const g = GLOSS[clean.toLowerCase()];
      if (g) tryAdd(clean, g);
    });
  });
  const roundSize = Math.min(40, Math.max(2, candidates.length));
  const sameThemeAsBefore = matchState.theme === theme;
  const prevIds = sameThemeAsBefore ? new Set(matchState.pairs.map(x => x.id)) : new Set();
  let source = candidates;
  if (candidates.length > roundSize) {
    const fresh = candidates.filter(c => !prevIds.has(c.id));
    if (fresh.length >= roundSize) source = fresh;
  }
  const pairs = shuffle(source.slice()).slice(0, roundSize);
  matchState = {
    theme, pairs,
    leftOrder: shuffle(pairs.map(x => x.id)),
    rightOrder: shuffle(pairs.map(x => x.id)),
    selLeft: null, selRight: null, matched: [], wrong: null,
  };
}


// Deteta itens em formato "Pergunta? — Resposta." (gerados como estrutura de
// Pergunta+Resposta) para os poder separar no modo "pensar a pergunta" do
// Escrever. Devolve null se o item não tiver essa estrutura.
function splitQA(item) {
  const no = fullSentence(item);
  const noParts = no.split(" — ");
  const ptParts = (item.pt || "").split(" — ");
  if (noParts.length !== 2 || ptParts.length !== 2) return null;
  return {
    question: noParts[0].trim(),
    answer: noParts[1].trim(),
    ptQuestion: ptParts[0].trim(),
    ptAnswer: ptParts[1].trim(),
  };
}

// ==================================================================
// MOTOR DE GERAÇÃO: banco de vocabulário + moldes de frase.
// Em vez de escrever centenas de frases à mão (frágil e difícil de manter),
// cada tema combina um pequeno banco de palavras com 1-3 moldes de frase.
// O produto das combinações dá uma baralho bem maior, sem repetição maçadora,
// e continua fácil de rever/corrigir uma palavra sem mexer em tudo.
// ==================================================================
function genMulti(theme, variants, bank, noField, ptField, cat) {
  const out = [];
  variants.forEach(v => {
    bank.forEach(w => {
      out.push({
        theme,
        blank: v.no.replace("{}", "___"),
        answer: w[noField],
        pt: v.pt.replace("{}", w[ptField]),
        cat: cat || null,
      });
    });
  });
  return out;
}

// ---------- Matching helpers ----------
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}
function wordSimilarity(a, b) {
  if (!a || !b) return 0;
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);
  return maxLen === 0 ? 1 : 1 - dist / maxLen;
}
function normalize(s) { return s.toLowerCase().replace(/[.,!?;:]/g, "").trim(); }

// Alinha as palavras-alvo com as palavras ouvidas por posição (programação
// dinâmica), em vez de aceitar a MELHOR palavra ouvida em qualquer posição da
// frase. Isto evita o problema de uma única palavra bem dita "salvar" várias
// palavras-alvo parecidas — cada palavra ouvida só pode ser usada uma vez, e
// uma palavra-alvo que falte fica mesmo com pontuação 0.
function alignWords(targetWords, heardWords) {
  const m = targetWords.length, n = heardWords.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  const choice = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(null));
  for (let i = 1; i <= m; i++) choice[i][0] = "skipT";
  for (let j = 1; j <= n; j++) choice[0][j] = "skipH";
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const matchScore = dp[i - 1][j - 1] + wordSimilarity(targetWords[i - 1], heardWords[j - 1]);
      const skipT = dp[i - 1][j];
      const skipH = dp[i][j - 1];
      if (matchScore >= skipT && matchScore >= skipH) { dp[i][j] = matchScore; choice[i][j] = "match"; }
      else if (skipT >= skipH) { dp[i][j] = skipT; choice[i][j] = "skipT"; }
      else { dp[i][j] = skipH; choice[i][j] = "skipH"; }
    }
  }
  const perTarget = new Array(m).fill(0);
  let i = m, j = n;
  while (i > 0 || j > 0) {
    const c = choice[i][j];
    if (c === "match") { perTarget[i - 1] = wordSimilarity(targetWords[i - 1], heardWords[j - 1]); i--; j--; }
    else if (c === "skipT") { perTarget[i - 1] = 0; i--; }
    else { j--; }
  }
  return perTarget;
}

// confidence: valor 0-1 opcional que o próprio reconhecedor de voz devolve
// sobre o quão certo está da transcrição — quando disponível, ajuda a puxar
// a pontuação para baixo em frases arrastadas/impercetíveis que, por sorte,
// ainda geraram um texto parecido com o alvo.
function compareSentences(target, heard, confidence) {
  const targetWords = normalize(target).split(/\s+/).filter(Boolean);
  const heardWords = normalize(heard).split(/\s+/).filter(Boolean);
  const perTarget = alignWords(targetWords, heardWords);
  const results = targetWords.map((tw, i) => ({ word: tw, score: perTarget[i] }));
  let overall = results.length ? (results.reduce((s, r) => s + r.score, 0) / results.length) : 0;
  if (typeof confidence === "number" && !isNaN(confidence)) {
    overall *= (0.55 + 0.45 * Math.max(0, Math.min(1, confidence)));
  }
  return { results, overall: Math.round(overall * 100) };
}

const STREAK_KEY = "norsk-puls-streak";
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function loadStreak() {
  try {
    const raw = localStorage.getItem(STREAK_KEY);
    return raw ? JSON.parse(raw) : { current: 0, longest: 0, lastDate: null };
  } catch { return { current: 0, longest: 0, lastDate: null }; }
}
function saveStreak(s) { try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch {} }
let streak = loadStreak();
// Chamado sempre que a pessoa faz alguma atividade real (responder um
// exercício em qualquer modo, terminar um teste, avançar na prática/escrita).
// Conta no máximo uma vez por dia — repetir atividade no mesmo dia não infla
// a sequência, e um dia inteiro sem nada quebra-a de volta para 1.
function touchStreak() {
  const today = todayStr();
  if (streak.lastDate === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yesterday = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, "0")}-${String(y.getDate()).padStart(2, "0")}`;
  streak.current = (streak.lastDate === yesterday) ? streak.current + 1 : 1;
  streak.longest = Math.max(streak.longest, streak.current);
  streak.lastDate = today;
  saveStreak(streak);
}

const THEME_GROUPS = [
  ["apresentacao", "cumprimentos"],
  ["trabalho", "industri"],
  ["basico", "quotidiano"],
];
function themeGroupIds(themeId) {
  const g = THEME_GROUPS.find(g => g.includes(themeId));
  return g || [themeId];
}
function themeGroupKey(themeId) {
  const g = themeGroupIds(themeId);
  return g.length > 1 ? g.slice().sort().join("+") : themeId;
}
function groupPool(themeId) {
  const ids = themeGroupIds(themeId);
  return allItems().filter(i => ids.includes(i.theme));
}
function groupNoteHtml(themeId) {
  const ids = themeGroupIds(themeId);
  if (ids.length < 2) return "";
  const labels = ids.filter(id => id !== themeId).map(id => {
    const t = THEMES.find(x => x.id === id);
    return t ? t.label : id;
  });
  return `<p class="mono" style="font-size:11px;color:var(--muted2);margin:-8px 0 14px">🔀 vocabulário partilhado com ${labels.join(", ")} nesta secção</p>`;
}

function getThemes() {
  const builtinIds = THEMES.map(t => t.id);
  const customThemeIds = [...new Set(customItems.map(i => i.theme))].filter(id => !builtinIds.includes(id));
  const customThemes = customThemeIds.map(id => ({ id, label: "✨ " + id.charAt(0).toUpperCase() + id.slice(1) }));
  return THEMES.concat(customThemes);
}

// Escolhe distractors plausíveis a partir de uma lista de itens candidatos.
// Prioridade 1: candidatos da MESMA CATEGORIA lexical (item.cat) — ex.: só
// profissões contra profissões, só números contra números — para nunca
// misturar "ingeniør" com "seks" ou "sju" só porque calharam no mesmo tema.
// Prioridade 2 (sem categoria, ou poucos candidatos da mesma): pontua por
// semelhança de "forma" (nº de palavras e comprimento) como aproximação.
// Palavras-número em norueguês — usadas para impedir que "sju", "seks", etc.
// apareçam como opção errada de itens que não são números (o problema mais
// visível quando um tema tem poucos itens próprios e cai no "resto" da app
// inteira à procura de distractors).
const NUMBER_WORDS_NO = new Set([
  "en", "ei", "et", "to", "tre", "fire", "fem", "seks", "sju", "syv", "åtte", "ni", "ti",
  "elleve", "tolv", "tretten", "fjorten", "femten", "seksten", "sytten", "atten", "nitten", "tjue", "tretti",
]);

function pickDistractors(item, candidates, count) {
  const answer = item.answer;
  const answerIsNumber = NUMBER_WORDS_NO.has(answer.toLowerCase());
  const targetWords = answer.trim().split(/\s+/).length;
  const seen = new Set([answer.toLowerCase()]);
  const scoreOf = (val) => {
    const words = val.trim().split(/\s+/).length;
    const wordMatch = words === targetWords ? 2 : 0;
    const lenDiff = Math.abs(val.length - answer.length);
    const lenScore = Math.max(0, 3 - Math.floor(lenDiff / 3));
    return wordMatch + lenScore;
  };
  let pool = [];
  if (item.cat) {
    for (const c of candidates) {
      if (c.cat !== item.cat) continue;
      const val = c.answer;
      if (seen.has(val.toLowerCase())) continue;
      seen.add(val.toLowerCase());
      pool.push(val);
    }
  }
  // Categoria não deu candidatos suficientes: completa com o resto, ordenado por forma.
  if (pool.length < count) {
    let rest = [];
    for (const c of candidates) {
      const val = c.answer;
      if (seen.has(val.toLowerCase())) continue;
      seen.add(val.toLowerCase());
      rest.push(val);
    }
    // A resposta certa não é um número: tira números-palavra do resto (a não
    // ser que sobrem candidatos a menos do que o necessário sem eles).
    if (!answerIsNumber) {
      const noNumbers = rest.filter(v => !NUMBER_WORDS_NO.has(v.toLowerCase()));
      if (noNumbers.length >= count - pool.length) rest = noNumbers;
    }
    const scoredRest = shuffle(rest)
      .map(val => ({ val, score: scoreOf(val) }))
      .sort((a, b) => b.score - a.score)
      .map(s => s.val);
    pool = pool.concat(scoredRest);
  } else {
    pool = shuffle(pool);
  }
  return pool.slice(0, count);
}

// Builds multiple-choice options for an item. Built-in items already ship with
// curated distractors; custom items only have an answer, so we auto-generate
// plausible wrong answers by sampling other answers from the same theme,
// preferindo opções da mesma categoria/"forma" que a resposta certa.
function optionsFor(item) {
  if (item.options && item.options.length >= 2) return shuffle(item.options);
  const others = allItems().filter(i => i.answer.toLowerCase() !== item.answer.toLowerCase());
  const groupIds = themeGroupIds(item.theme);
  const sameTheme = others.filter(i => groupIds.includes(i.theme));
  const source = sameTheme.length >= 4 ? sameTheme : others;
  const distractors = pickDistractors(item, source, 4);
  return shuffle([item.answer, ...distractors]);
}

// Opções para o TESTE SEMANAL: ao contrário dos exercícios diários (que usam
// as opções fixas curadas de cada item, sempre iguais), o teste ignora essas
// opções fixas de propósito e sorteia distractors de OUTRAS frases da mesma
// pool do tema. Isto evita que o teste seja sempre igual aos exercícios e
// que as opções erradas sejam sempre as mesmas e óbvias por repetição.
function optionsForTest(item, poolItems) {
  const source = poolItems.filter(i => i.answer.toLowerCase() !== item.answer.toLowerCase());
  const distractors = pickDistractors(item, source, 4);
  // Pool pequena demais para 4 distractors: completa com as opções curadas do item, se existirem.
  if (distractors.length < 3 && item.options) {
    const seen = new Set([item.answer.toLowerCase(), ...distractors.map(d => d.toLowerCase())]);
    for (const o of item.options) {
      if (distractors.length >= 4) break;
      if (!seen.has(o.toLowerCase())) { seen.add(o.toLowerCase()); distractors.push(o); }
    }
  }
  return shuffle([item.answer, ...distractors]);
}

const NEWS_RATE_KEY = "norsk-puls-rate";
const NEWS_VOICE_KEY = "norsk-puls-voice";
function loadNewsRate() {
  try { const raw = localStorage.getItem(NEWS_RATE_KEY); return raw ? parseFloat(raw) : 1.0; } catch { return 1.0; }
}
function saveNewsRate(r) { try { localStorage.setItem(NEWS_RATE_KEY, String(r)); } catch {} }
function loadNewsVoice() {
  try { return localStorage.getItem(NEWS_VOICE_KEY) || ""; } catch { return ""; }
}
function saveNewsVoice(name) { try { localStorage.setItem(NEWS_VOICE_KEY, name); } catch {} }

function getNorwegianVoices() {
  if (!window.speechSynthesis) return [];
  // Só bokmål (nb) e o código genérico "no" que alguns motores de voz usam
  // quando não distinguem os dois padrões escritos do norueguês. "nn"
  // (nynorsk) fica de fora de propósito — toda a app ensina bokmål, por
  // isso não faz sentido oferecer uma voz nynorsk para ler este texto.
  return window.speechSynthesis.getVoices().filter(v => v.lang && /^(nb|no)/i.test(v.lang) && !/^nn/i.test(v.lang));
}

// Maps each word in a sentence to its character start/end, using the exact
// same tokenisation the browser's onboundary charIndex refers to (\S+ runs).
function buildWordMap(text) {
  const map = [];
  const re = /\S+/g;
  let m, idx = 0;
  while ((m = re.exec(text))) { map.push({ start: m.index, end: m.index + m[0].length, idx }); idx++; }
  return map;
}

function speak(text, onError) {
  if (!window.speechSynthesis) { onError && onError("A síntese de voz não é suportada neste navegador."); return; }
  const doSpeak = () => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "nb-NO";
    const voices = window.speechSynthesis.getVoices();
    const chosen = voices.find(v => v.name === newsVoiceName)
      || voices.find(v => v.lang && (v.lang.toLowerCase().startsWith("nb") || v.lang.toLowerCase().startsWith("no")));
    if (chosen) utter.voice = chosen;
    utter.rate = newsRate;
    utter.onerror = () => onError && onError("Não foi possível reproduzir o áudio.");
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  };
  const existing = window.speechSynthesis.getVoices();
  if (existing.length > 0) doSpeak();
  else {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; doSpeak(); };
    setTimeout(doSpeak, 300);
  }
}
function getRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = "nb-NO";
  rec.interimResults = true;
  rec.continuous = false;
  return rec;
}

// ---------- Parser de importação em lote ----------
// Objetivo: aceitar o máximo de linhas possível. Em vez de descartar
// silenciosamente tudo o que não bata certo com "4 partes separadas por |",
// isto (1) ignora só o que é claramente ruído de formatação (títulos
// markdown, separadores de tabela, marcadores de lista/numeração), (2) volta
// a juntar entradas que ficaram partidas em duas linhas físicas — comum
// quando se cola texto vindo de outra conversa de IA que quebra linhas
// longas — e (3) só quando faltam campos usa um valor por omissão razoável
// (o tema atualmente selecionado) em vez de descartar a linha toda.
function parseImportLines(raw) {
  const rawLines = raw.split(/\r?\n/);
  const cleaned = [];
  for (let line of rawLines) {
    let l = line.trim();
    if (!l) { cleaned.push(""); continue; }
    // linha separadora de tabela markdown: | --- | --- | --- | --- |
    if (/^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?$/.test(l)) continue;
    // títulos markdown (### Tema: X) ou texto em negrito isolado sem "|"
    if (/^#{1,6}\s/.test(l)) continue;
    // cabeçalho do próprio formato de exemplo, colado por engano
    if (/^frase.*\|\s*resposta\s*\|\s*tradu[cç][aã]o\s*\|\s*tema$/i.test(l)) continue;
    if (/^\*\*[^|]*\*\*:?\s*$/.test(l)) continue;
    // marcadores de lista / numeração no início da linha
    l = l.replace(/^(\d+[.)]|[-*•▪])\s+/, "");
    // pipes de tabela markdown sobrando no início/fim da linha
    if (l.startsWith("|")) l = l.slice(1);
    if (l.endsWith("|")) l = l.slice(0, -1);
    l = l.trim();
    if (l) cleaned.push(l);
  }
  // Junta linhas partidas: uma entrada válida tem pelo menos 3 "|" (4 campos).
  // Vai acumulando texto até lá, ou até encontrar uma linha em branco.
  const merged = [];
  let buffer = "";
  for (const l of cleaned) {
    if (!l) { if (buffer) { merged.push(buffer); buffer = ""; } continue; }
    buffer = buffer ? buffer + " " + l : l;
    if ((buffer.match(/\|/g) || []).length >= 3) { merged.push(buffer); buffer = ""; }
  }
  if (buffer) merged.push(buffer);
  return merged;
}

// Interpreta uma entrada já unida em { sentence, answer, pt, theme, note }.
// Só devolve null se não houver dados suficientes para criar um exercício
// (nem sequer uma resposta).
function parseImportEntry(entry, fallbackTheme) {
  const parts = entry.split("|").map(p => p.trim().replace(/^["']|["']$/g, ""));
  let sentence, answer, pt, theme, note = "";
  if (parts.length >= 4) {
    sentence = parts[0];
    answer = parts[1];
    pt = parts.slice(2, parts.length - 1).join(" — "); // tradução pode ter tido "|" a mais
    theme = parts[parts.length - 1];
  } else if (parts.length === 3) {
    [sentence, answer, pt] = parts;
    theme = fallbackTheme;
    note = "sem tema — usado o tema atual";
  } else if (parts.length === 2) {
    [sentence, answer] = parts;
    pt = "";
    theme = fallbackTheme;
    note = "sem tradução nem tema — usado o tema atual";
  } else {
    return null;
  }
  if (!answer) return null;
  theme = (theme || fallbackTheme).toLowerCase().trim().replace(/\s+/g, "-");
  if (!sentence) sentence = "___";
  else if (!sentence.includes("___")) sentence = sentence + " ___";
  if (!pt) pt = "(sem tradução)";
  return { sentence, answer, pt, theme, note };
}

function pool() { return allItems().filter(i => i.theme === currentTheme); }

// ---------- Progresso híbrido persistente (localStorage) ----------
// Cada tema+modo ("ex" = exercícios, "pr" = praticar) guarda:
//  - uma ORDEM fixa e embaralhada dos itens (para o "cursor" fazer sentido sempre)
//  - um CURSOR = até onde já respondeste bem, em sequência, sem parar
// A pessoa pode sempre navegar livremente com as setas (viewState, só em memória)
// sem mexer no cursor guardado — por isso nunca perde o progresso "oficial".
function orderKey(mode, theme) { return `norsk-puls-order-${mode}-${theme}`; }
function cursorKey(mode, theme) { return `norsk-puls-cursor-${mode}-${theme}`; }
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; } catch { return fallback; }
}
function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

function getOrderIds(mode, theme) {
  const themeIds = mode === "ex" ? themeGroupIds(theme) : [theme];
  const groupTheme = mode === "ex" ? themeGroupKey(theme) : theme;
  const ids = allItems().filter(i => themeIds.includes(i.theme)).map(i => i.id);
  const idSet = new Set(ids);
  let order = loadJSON(orderKey(mode, groupTheme), null);
  if (!order) {
    order = shuffle(ids.slice());
    saveJSON(orderKey(mode, groupTheme), order);
    return order;
  }
  let filtered = order.filter(id => idSet.has(id));
  const missing = ids.filter(id => !filtered.includes(id));
  if (missing.length) filtered = filtered.concat(shuffle(missing));
  if (filtered.length !== order.length) saveJSON(orderKey(mode, groupTheme), filtered);
  return filtered;
}
function resolveOrder(mode, theme) {
  const themeIds = mode === "ex" ? themeGroupIds(theme) : [theme];
  const ids = getOrderIds(mode, theme);
  const map = new Map(allItems().filter(i => themeIds.includes(i.theme)).map(i => [i.id, i]));
  return ids.map(id => map.get(id)).filter(Boolean);
}
function getCursor(mode, theme, len) {
  const groupTheme = mode === "ex" ? themeGroupKey(theme) : theme;
  let c = loadJSON(cursorKey(mode, groupTheme), 0);
  if (typeof c !== "number" || c < 0 || isNaN(c)) c = 0;
  if (c > len) c = len;
  return c;
}
function setCursor(mode, theme, idx) {
  const groupTheme = mode === "ex" ? themeGroupKey(theme) : theme;
  saveJSON(cursorKey(mode, groupTheme), idx);
}

// Posição que a pessoa está a VER neste momento (transitória, não guardada).
// Só o cursor acima é que representa o progresso oficial.
let viewState = { ex: {}, pr: {} };
function getViewIdx(mode, theme, order, cursor) {
  const key = mode === "ex" ? themeGroupKey(theme) : theme;
  if (viewState[mode][key] === undefined) {
    viewState[mode][key] = Math.min(cursor, Math.max(order.length - 1, 0));
  }
  let v = viewState[mode][key];
  if (v < 0) v = 0;
  if (v > order.length - 1) v = Math.max(order.length - 1, 0);
  viewState[mode][key] = v;
  return v;
}
function setViewIdx(mode, theme, idx) {
  const key = mode === "ex" ? themeGroupKey(theme) : theme;
  viewState[mode][key] = idx;
}

function practiceIdxKey(theme) { return `norsk-puls-practice-idx-${theme}`; }
function loadPracticeIdx(theme) {
  const v = loadJSON(practiceIdxKey(theme), 0);
  return typeof v === "number" && v >= 0 ? v : 0;
}
function savePracticeIdx(theme, idx) { saveJSON(practiceIdxKey(theme), idx); }

function renderThemeTabs() {
  const el = document.getElementById("themeTabs");
  const themes = getThemes();
  el.innerHTML = themes.map(t => {
    const order = resolveOrder("ex", t.id);
    const cursor = order.length ? Math.min(getCursor("ex", t.id, order.length), order.length) : 0;
    const pct = order.length ? Math.round((cursor / order.length) * 100) : 0;
    // Sinal rápido de progresso, visível sem ires a 📊 Progresso: ✓ quando
    // já respondeste certo a tudo pelo menos uma vez, ou a percentagem
    // enquanto ainda vais a meio. Nada aparece em temas por começar.
    const badge = !order.length ? "" : pct >= 100
      ? ` <span class="theme-progress done">✓</span>`
      : pct > 0 ? ` <span class="theme-progress">${pct}%</span>` : "";
    return `<button class="tab-btn ${t.id === currentTheme ? "active" : ""}" data-theme="${t.id}">${t.label}${badge}</button>`;
  }).join("");
  el.querySelectorAll(".tab-btn").forEach(b => {
    b.onclick = () => {
      if (b.dataset.theme === currentTheme) return;
      currentTheme = b.dataset.theme;
      practiceIdx = loadPracticeIdx(currentTheme);
      heard = ""; result = null; micError = ""; listening = false; showPhonetic = false; writeIdx = 0; writeQIdx = 0; writeRevealed = false; buildLastKey = null;
      exSelected = null; exerciseOptions = null;
      testState = { running: false, set: [], idx: 0, selected: null, currentOptions: null, tally: 0, finished: false, lastScore: null };
      render();
    };
  });
}

      const c = result.overall >= 80 ? "var(--green)" : result.overall >= 60 ? "var(--amber)" : "var(--red)";
      scoreHtml = `<div class="match-row">correspondência: <span class="score-pill" style="color:${c};border-color:${c}">${result.overall}%</span></div>`;
      pillsHtml = `<div class="pills">` + result.results.map(r => {
        const bg = r.score >= 0.8 ? "rgba(74,222,140,0.18)" : r.score >= 0.5 ? "rgba(240,193,104,0.18)" : "rgba(239,111,108,0.18)";
        const border = r.score >= 0.8 ? "var(--green)" : r.score >= 0.5 ? "var(--amber)" : "var(--red)";
        return `<span class="word-pill" style="background:${bg};border-color:${border}">${r.word}</span>`;
      }).join("") + `</div>`;
      const msg = result.overall >= 80 ? "Muito bem! Pronúncia sólida." : result.overall >= 60 ? "Está no bom caminho — repete devagar as palavras a amarelo/vermelho." : "Ouve a frase outra vez e tenta repetir palavra a palavra.";
      feedbackHtml = `<p class="feedback-text">${msg}</p>`;
    }
    heardBlock = `<div class="heard-block"><p class="heard-label">ouvi: <span style="color:var(--text)">${heard}</span></p>${scoreHtml}${pillsHtml}${feedbackHtml}</div>`;
  }
  // Três níveis, como no Duolingo: ≥80% avança (verde); 60-79% e <60% têm
  // de repetir a pronúncia (amarelo/vermelho) — só o botão pequeno de
  // "Próxima frase" desaparece nesses dois casos, para não dar para saltar
  // sem repetir.
  const tier = result ? (result.overall >= 80 ? "correct" : result.overall >= 60 ? "warn" : "wrong") : null;

  return `
    <div class="card">
      <p class="card-label mono">frase ${practiceIdx + 1} de ${p.length}</p>
      <p class="sentence display">${target}</p>
      <p class="translation">${item.pt}</p>
      <button class="btn phon-toggle" id="btnTogglePhon" style="margin-bottom:16px">${showPhonetic ? "🙈 Esconder pronúncia" : "👁️ Ver pronúncia (aproximada)"}</button>
      ${showPhonetic ? `<p class="mono" style="color:var(--muted);font-size:13px;margin:-8px 0 16px">${item.fon || "Este item ainda não tem guia fonético escrito à mão. Usa o botão 🔊 Ouvir abaixo — a pronúncia gravada é mais fiável do que qualquer aproximação escrita."}</p>` : ""}
      <div class="btn-row">
        <button class="btn listen" id="btnOuvir">🔊 Ouvir</button>
        ${supported
          ? `<button class="btn ${listening ? "listening" : ""}" id="btnFalar">🎙️ ${listening ? "A ouvir... (toca para parar)" : "Falar"}</button>`
          : `<span class="error-text">reconhecimento de voz não suportado neste navegador</span>`}
      </div>
      <div class="news-speed-block">
        <div class="news-speed-label"><span>velocidade</span><span class="mono">${newsRate.toFixed(2)}x</span></div>
        <input class="news-speed-slider" id="practiceSpeedSlider" type="range" min="0.5" max="1.0" step="0.05" value="${newsRate}">
      </div>
      ${(() => {
        const voices = getNorwegianVoices();
        if (!voices.length) return "";
        return `<select class="news-select" id="practiceVoiceSelect" style="margin-bottom:12px">${voices.map(v => `<option value="${v.name}" ${v.name === newsVoiceName ? "selected" : ""}>${v.name} (${v.lang})</option>`).join("")}</select>`;
      })()}
      ${micError ? `<p class="error-text">${micError}</p>` : ""}
      ${heardBlock}
      <div class="nav-row" style="display:flex;gap:8px;margin-top:8px">
        <button class="news-icon-btn" id="btnPracPrev" ${practiceIdx <= 0 ? "disabled" : ""} title="Anterior">◀</button>
        ${tier ? "" : `<button class="btn next" id="btnNext" style="flex:1">Próxima frase →</button>`}
      </div>
      ${tier ? `<div style="height:100px"></div>` : ""}
    </div>
    ${tier === "correct" ? feedbackSheetHtml({
      tier: "correct",
      title: "Muito bem!",
      detail: `Pronúncia sólida — correspondência de ${result.overall}%.`,
      btnId: "btnNext",
      btnLabel: "CONTINUAR",
    }) : ""}
    ${(tier === "warn" || tier === "wrong") ? feedbackSheetHtml({
      tier,
      title: tier === "warn" ? "Quase lá!" : "Repete outra vez",
      detail: `Correspondência de ${result.overall}% — repete a frase, focando nas palavras a ${tier === "warn" ? "amarelo" : "amarelo e vermelho"} acima.`,
      btnId: "btnPracRetry",
      btnLabel: "TENTAR NOVAMENTE",
    }) : ""}
    <p class="note">Nota: a pontuação compara o que o reconhecimento de voz percebeu com a frase-alvo — é um bom indicador para começar, mas ainda não é uma análise fonética completa. O teu progresso nesta secção fica guardado automaticamente.</p>
  `;
}

function renderWrite() {
  const p = pool();
  if (!p.length) {
    return `<div class="card center-card"><p class="translation">Ainda não há frases neste tema.</p></div>`;
  }

  const modeBar = (qaCount) => `
    <div class="btn-row" style="margin-bottom:16px;flex-wrap:wrap">
      <button class="tab-btn ${writeMode === "recall" ? "active" : ""}" id="btnWriteModeRecall">🧠 Memória</button>
      <button class="tab-btn ${writeMode === "question" ? "active" : ""}" id="btnWriteModeQuestion">❓ Pensar a pergunta${qaCount ? "" : " (0)"}</button>
      <button class="tab-btn ${writeMode === "copy" ? "active" : ""}" id="btnWriteModeCopy">📋 Copiar (caligrafia)</button>
    </div>`;

  // ---- Modo "Pensar a pergunta": mostra só a resposta, tens de escrever a pergunta ----
  if (writeMode === "question") {
    const qaItems = p.map(splitQA).map((qa, i) => qa ? { qa, item: p[i] } : null).filter(Boolean);
    if (!qaItems.length) {
      return `
        <div class="card">
          ${modeBar(0)}
          <p class="translation">Este tema ainda não tem frases no formato "pergunta — resposta", por isso não há nada para praticar neste modo aqui. Escolhe outro tema (ex.: Quotidiano, Apresentação, Trabalho) ou muda de modo.</p>
        </div>`;
    }
    if (writeQIdx >= qaItems.length) writeQIdx = 0;
    const { qa } = qaItems[writeQIdx];
    return `
      <div class="card">
        <p class="card-label mono">pensar a pergunta ${writeQIdx + 1} de ${qaItems.length}</p>
        ${modeBar(qaItems.length)}
        <p class="sentence display">${qa.answer}</p>
        <p class="translation" style="margin-bottom:16px">${qa.ptAnswer}</p>
        <p class="note" style="margin-bottom:16px">Escreve, de memória, a PERGUNTA em norueguês que levaria a esta resposta.</p>
        <div class="canvas-wrap"><canvas id="writeCanvas"></canvas></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" id="btnClearCanvas">🧹 Limpar</button>
          <button class="btn" id="btnWriteReveal">${writeRevealed ? "🙈 Esconder" : "👁️ Ver pergunta certa"}</button>
        </div>
        ${writeRevealed ? `
          <div class="gloss-block" style="margin-top:12px">
            <p class="sentence display" style="font-size:18px">${qa.question}</p>
            <p class="translation">${qa.ptQuestion}</p>
            <button class="btn listen" id="btnWriteOuvir" style="margin-top:8px">🔊 Ouvir</button>
          </div>` : ""}
        <button class="btn next" id="btnWriteNext" style="margin-top:16px">Próxima →</button>
      </div>
      <p class="note">Modo pergunta: obriga-te a pensar em como se pergunta algo em norueguês, não só a copiar a resposta.</p>
    `;
  }

  // ---- Modo "Memória": só vês a tradução, tens de escrever a frase toda de cor ----
  if (writeMode === "recall") {
    if (writeIdx >= p.length) writeIdx = 0;
    const item = p[writeIdx];
    const target = fullSentence(item);
    return `
      <div class="card">
        <p class="card-label mono">escrever de memória ${writeIdx + 1} de ${p.length}</p>
        ${modeBar(p.filter(splitQA).length)}
        <p class="translation" style="font-size:18px;margin-bottom:16px">${item.pt}</p>
        <p class="note" style="margin-bottom:16px">Escreve a frase completa em norueguês, de memória — sem espreitar.</p>
        <div class="canvas-wrap"><canvas id="writeCanvas"></canvas></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" id="btnClearCanvas">🧹 Limpar</button>
          <button class="btn" id="btnWriteReveal">${writeRevealed ? "🙈 Esconder" : "👁️ Ver resposta"}</button>
        </div>
        ${writeRevealed ? `
          <div class="gloss-block" style="margin-top:12px">
            <p class="sentence display" style="font-size:18px">${target}</p>
            <button class="btn listen" id="btnWriteOuvir" style="margin-top:8px">🔊 Ouvir</button>
          </div>` : ""}
        <button class="btn next" id="btnWriteNext" style="margin-top:16px">Próxima frase →</button>
      </div>
      <p class="note">Modo memória: não vês a frase em norueguês antes de a escreveres — só depois, quando carregares em "Ver resposta".</p>
    `;
  }

  // ---- Modo "Copiar": o comportamento original, bom para treinar o traço/ortografia ----
  if (writeIdx >= p.length) writeIdx = 0;
  const item = p[writeIdx];
  const target = fullSentence(item);
  return `
    <div class="card">
      <p class="card-label mono">copiar ${writeIdx + 1} de ${p.length}</p>
      ${modeBar(p.filter(splitQA).length)}
      <p class="sentence display">${target}</p>
      <p class="translation" style="margin-bottom:16px">${item.pt}</p>
      <div class="btn-row" style="margin-bottom:16px">
        <button class="btn listen" id="btnWriteOuvir">🔊 Ouvir</button>
      </div>
      <div class="canvas-wrap"><canvas id="writeCanvas"></canvas></div>
      <div class="btn-row">
        <button class="btn" id="btnClearCanvas">🧹 Limpar</button>
        <button class="btn next" id="btnWriteNext">Próxima frase →</button>
      </div>
    </div>
    <p class="note">Escreve a frase à mão na tela, copiando o que vês acima — bom para treinares o æ, ø, å e a ortografia. Não há correção automática, é só para praticares o traço.</p>
  `;
}

// Painel de feedback fixo ao fundo do ecrã (estilo Duolingo), usado depois
// de responder em escolha múltipla / construir frase / ditado / traduzir /
// praticar. btnId é sempre um id que já existe no resto do código — o
// botão reaproveita o handler que já estava ligado a esse id, por isso
// esta função só muda a aparência, nunca a lógica de navegação.
// tier: "correct" (verde) | "warn" (amarelo) | "wrong" (vermelho).
// Para compatibilidade, passar correct:true/false também funciona (vira
// tier "correct"/"wrong").
function feedbackSheetHtml({ correct, tier, title, detail, btnId, btnLabel }) {
  const t = tier || (correct ? "correct" : "wrong");
  const icon = t === "correct" ? "✅" : t === "warn" ? "🔶" : "❌";
  return `
    <div id="feedbackSheet" class="feedback-sheet ${t}">
      <div class="feedback-content">
        <div class="feedback-icon" id="feedbackIcon">${icon}</div>
        <div class="feedback-text-wrap">
          <h3 id="feedbackTitle">${title}</h3>
          <p id="feedbackDetail">${detail || ""}</p>
        </div>
      </div>
      <button class="btn-continue" id="${btnId}">${btnLabel}</button>
    </div>
  `;
}

function sessionHeaderHtml(item, viewIdx, order) {
  const wc = fullSentence(item).split(" ").filter(Boolean).length;
  let diff = { cls: "easy", icon: "🟢", label: "EXERCÍCIO FÁCIL" };
  if (wc >= 7) diff = { cls: "hard", icon: "🔴", label: "EXERCÍCIO DIFÍCIL" };
  else if (wc >= 4) diff = { cls: "medium", icon: "🟡", label: "EXERCÍCIO MÉDIO" };
  const pct = Math.round(((viewIdx + 1) / order.length) * 100);
  return `
    <div class="session-bar-row">
      <div class="session-bar"><div class="session-bar-fill" style="width:${pct}%"></div></div>
      <span class="session-points mono">⚡ ${points}</span>
    </div>
    <div class="diff-badge ${diff.cls}">${diff.icon} ${diff.label}</div>
  `;
}

function renderExercises() {
  const theme = currentTheme;
  const order = resolveOrder("ex", theme);
  if (!order.length) {
    return `<div class="card center-card"><p class="translation">Ainda não há exercícios neste tema.</p></div>`;
  }
  const cursor = getCursor("ex", theme, order.length);
  const completedAll = cursor >= order.length;
  const viewIdx = getViewIdx("ex", theme, order, completedAll ? order.length - 1 : cursor);
  const isLive = !completedAll && viewIdx === cursor;

  const item = order[viewIdx];

  const banner = completedAll
    ? `<div class="card center-card" style="margin-bottom:12px;padding:16px">
        <p class="display" style="font-size:17px;font-weight:600;margin:2px 0">🎉 Já respondeste certo a todas as ${order.length} deste tema!</p>
        <p class="translation" style="margin-bottom:0">Continua a rever à vontade com as setas abaixo, sempre que quiseres.</p>
      </div>`
    : "";

  const modeBar = `
    <div class="btn-row" style="margin-bottom:16px;flex-wrap:wrap">
      <button class="tab-btn ${exMode === "choice" ? "active" : ""}" id="btnExModeChoice">🔘 Escolha múltipla</button>
      <button class="tab-btn ${exMode === "build" ? "active" : ""}" id="btnExModeBuild">🧩 Construir a frase</button>
      <button class="tab-btn ${exMode === "listen" ? "active" : ""}" id="btnExModeListen">🎧 Ditado</button>
      <button class="tab-btn ${exMode === "listenTranslate" ? "active" : ""}" id="btnExModeListenTranslate">🌍 Ouvir e traduzir</button>
      <button class="tab-btn ${exMode === "match" ? "active" : ""}" id="btnExModeMatch">🔗 Emparelhar</button>
    </div>
    ${groupNoteHtml(theme)}`;

  if (exMode === "match") {
    if (matchState.theme !== theme) setupMatch(theme);
    const { pairs, leftOrder, rightOrder, selLeft, selRight, matched, wrong } = matchState;
    const allMatched = pairs.length >= 2 && matched.length === pairs.length;
    const byId = Object.fromEntries(pairs.map(x => [x.id, x]));
    const tile = (id, side, label) => {
      const isMatched = matched.includes(id);
      const isSel = (side === "l" ? selLeft : selRight) === id;
      const isWrong = wrong && wrong[side] === id;
      let cls = "opt-btn match-tile";
      if (isMatched) cls += " correct";
      else if (isWrong) cls += " wrong";
      else if (isSel) cls += " selected";
      return `<button class="${cls}" data-side="${side}" data-id="${id}" ${isMatched ? "disabled" : ""}>${label}</button>`;
    };
    const bodyHtml = pairs.length < 2
      ? `<p class="translation">Este tema ainda não tem palavras suficientes para emparelhar.</p>`
      : `
        <div class="top-row">
          <p class="card-label mono" style="margin:0">emparelhar pares</p>
          <span class="mono" style="font-size:12px;color:var(--muted)">${matched.length}/${pairs.length}</span>
        </div>
        <div class="match-grid">
          <div class="match-col">${leftOrder.map(id => tile(id, "l", byId[id].pt)).join("")}</div>
          <div class="match-col">${rightOrder.map(id => tile(id, "r", byId[id].no)).join("")}</div>
        </div>
        ${allMatched ? `<p class="feedback-text" style="margin-top:14px">🎉 Muito bem! Encontraste todos os pares.</p>
        <button class="btn next" id="btnMatchNext" style="margin-top:12px">Nova ronda →</button>` : ""}
      `;
    return `
      ${banner}
      <div class="card">
        ${modeBar}
        ${bodyHtml}
      </div>
    `;
  }

  if (exMode === "build" || exMode === "listen" || exMode === "listenTranslate") {
    const key = exMode + ":" + item.id;
    if (buildLastKey !== key) {
      if (exMode === "build") initBuild(item);
      else if (exMode === "listen") initListen(item);
      else initListenTranslate(item);
    }
    const target = exMode === "listenTranslate" ? item.pt : fullSentence(item);
    const targetWords = target.split(" ").filter(Boolean);
    const answerHtml = buildAnswer.length
      ? buildAnswer.map((t, i) => {
          let cls = "word-chip";
          if (buildWrong) {
            const correctWord = (targetWords[i] || "").toLowerCase();
            cls += t.text.toLowerCase() === correctWord ? " correct" : " wrong";
          }
          return `<button class="${cls}" data-tile="${t.id}" data-zone="answer">${t.text}</button>`;
        }).join("")
      : `<span style="color:var(--muted);font-size:13px">toca nas palavras abaixo, pela ordem certa</span>`;
    const bankHtml = buildBank.map(t => `<button class="word-chip" data-tile="${t.id}" data-zone="bank">${t.text}</button>`).join("");

    const listenBtn = `<div class="btn-row" style="margin-bottom:8px"><button class="btn listen" id="btnExListenTop">🔊 Ouvir</button></div>`;
    const promptHtml = exMode === "build"
      ? `<p class="translation" style="font-size:17px;margin-bottom:8px">${item.pt}</p>${listenBtn}`
      : `${listenBtn}<p class="note" style="margin-bottom:16px">${exMode === "listen" ? "Ouve quantas vezes precisares e constrói a frase em norueguês que ouviste." : "Ouve a frase em norueguês e constrói a TRADUÇÃO em português com os blocos abaixo."}</p>`;

    const resultBlock = buildChecked
      ? feedbackSheetHtml({
          correct: true,
          title: "Certo!",
          detail: `${exMode === "listenTranslate" ? "Norueguês" : "Frase certa"}: <b>${fullSentence(item)}</b>${exMode !== "build" ? ` · Português: ${item.pt}` : ""}`,
          btnId: "btnBuildNext",
          btnLabel: "CONTINUAR",
        })
      : buildGaveUp
      ? `
        <div class="btn-row" style="margin-top:8px">
          <button class="btn listen" id="btnExListenResult">🔊 Ouvir</button>
        </div>
      ` + feedbackSheetHtml({
          correct: false,
          title: "A resposta certa era:",
          detail: `${exMode === "listenTranslate" ? "Norueguês" : "Frase"}: <b>${fullSentence(item)}</b>${exMode !== "build" ? ` · Português: ${item.pt}` : ""}`,
          btnId: "btnBuildNext",
          btnLabel: "CONTINUAR",
        })
      : `
        ${buildWrong ? `<p class="translation" style="color:var(--red);margin-bottom:12px">❌ Ainda não está certo — as palavras a vermelho não estão na posição certa. Ajusta e verifica outra vez.</p>` : ""}
        <div class="btn-row" style="margin-top:16px">
          <button class="btn next" id="btnBuildCheck" ${buildAnswer.length ? "" : "disabled"}>Verificar</button>
          ${buildWrong ? `<button class="btn" id="btnBuildGiveUp">👀 Ver a resposta</button>` : ""}
        </div>
      `;

    return `
      ${banner}
      <div class="card">
        ${sessionHeaderHtml(item, viewIdx, order)}
        <div class="top-row">
          <p class="card-label mono" style="margin:0">exercício ${viewIdx + 1} de ${order.length}${isLive ? "" : " · 🔁 revisão"}</p>
          <span class="mono" style="font-size:12px;color:var(--muted)">progresso: ${cursor}/${order.length}</span>
        </div>
        ${modeBar}
        ${promptHtml}
        <div class="word-bank-container">
          <div class="sentence-builder-target" id="answerArea">${answerHtml}</div>
          <hr class="divider">
          <div class="word-bank-pool" id="wordPool">${bankHtml}</div>
        </div>
        ${resultBlock}
        <div class="nav-row" style="display:flex;gap:8px;align-items:center;margin-top:16px">
          <button class="news-icon-btn" id="btnExPrev" ${viewIdx <= 0 ? "disabled" : ""} title="Anterior">◀</button>
          ${!isLive ? `<button class="btn" id="btnExJumpLive" style="flex:1">↩️ voltar ao meu progresso</button>` : `<span style="flex:1"></span>`}
          <button class="news-icon-btn" id="btnExNextNav" ${viewIdx >= order.length - 1 ? "disabled" : ""} title="Seguinte">▶</button>
        </div>
        ${(buildChecked || buildGaveUp) ? `<div style="height:100px"></div>` : ""}
      </div>
    `;
  }

  if (!exerciseOptions || exerciseOptions._for !== item.id) {
    exerciseOptions = { list: optionsFor(item), _for: item.id };
  }
  const optsHtml = exerciseOptions.list.map(opt => {
    const isCorrect = opt === item.answer;
    const isSelected = opt === exSelected;
    let cls = "opt-btn";
    if (exSelected) {
      if (isCorrect) cls += " correct";
      else if (isSelected) cls += " wrong";
      else cls += " dim";
    }
    return `<button class="${cls}" data-opt="${opt}">${opt}${exSelected && isCorrect ? " ✓" : ""}${exSelected && isSelected && !isCorrect ? " ✗" : ""}</button>`;
  }).join("");

  return `
    ${banner}
    <div class="card">
      ${sessionHeaderHtml(item, viewIdx, order)}
      <div class="top-row">
        <p class="card-label mono" style="margin:0">exercício ${viewIdx + 1} de ${order.length}${isLive ? "" : " · 🔁 revisão"}</p>
        <span class="mono" style="font-size:12px;color:var(--muted)">progresso: ${cursor}/${order.length}</span>
      </div>
      ${modeBar}
      <div class="btn-row" style="margin-bottom:8px"><button class="btn listen" id="btnExListenChoice">🔊 Ouvir</button></div>
      <p class="sentence display">${item.blank}</p>
      <p class="translation">${item.pt}</p>
      <div class="options">${optsHtml}</div>
      ${exSelected ? `<div class="gloss-block">
        <p class="mono" style="font-size:11px;color:var(--muted);margin:0 0 8px">significado literal de cada palavra (a tradução da frase acima é o sentido natural em português, não uma tradução palavra a palavra):</p>
        ${exerciseOptions.list.map(o => `<p class="gloss-line"><b>${o}</b> — ${glossFor(o) || "significado não disponível"}</p>`).join("")}
        ${(item.cat === "vehicle_def" || item.cat === "vehicle_bare") ? `<p class="mono" style="font-size:11px;color:var(--muted);margin:8px 0 0">💡 em norueguês, o sufixo <b>-en/-a/-et</b> no fim da palavra forma o "definido" (ex.: <i>sykkelen</i> = a bicicleta); sem sufixo é a forma indefinida (<i>sykkel</i> = uma bicicleta).</p>` : ""}
      </div>` : ""}
      <div class="nav-row" style="display:flex;gap:8px;align-items:center;margin-top:16px">
        <button class="news-icon-btn" id="btnExPrev" ${viewIdx <= 0 ? "disabled" : ""} title="Anterior">◀</button>
        ${!isLive ? `<button class="btn" id="btnExJumpLive" style="flex:1">↩️ voltar ao meu progresso</button>` : `<span style="flex:1"></span>`}
        <button class="news-icon-btn" id="btnExNextNav" ${viewIdx >= order.length - 1 ? "disabled" : ""} title="Seguinte">▶</button>
      </div>
      ${exSelected ? `<div style="height:100px"></div>` : ""}
    </div>
    ${exSelected ? feedbackSheetHtml({
      correct: exSelected === item.answer,
      title: exSelected === item.answer ? "Muito bem!" : "Quase lá!",
      detail: exSelected === item.answer ? "" : `A resposta certa era: <b>${item.answer}</b>`,
      btnId: "btnExNext",
      btnLabel: isLive && exSelected !== item.answer ? "TENTAR DE NOVO" : "CONTINUAR",
    }) : ""}
  `;
}

function renderTest() {
  if (testState.finished) {
    const s = testState.lastScore;
    const msg = s >= 80 ? "Excelente! Já dominas bem esta matéria." : s >= 50 ? "Bom trabalho — vale a pena reforçar mais um pouco." : "Sem problema, ainda estás a começar. Volta à prática e tenta outra vez quando quiseres.";
    return `
      <div class="card center-card">
        <p class="display" style="font-size:28px;font-weight:600;margin:8px 0">${s}%</p>
        <p class="translation" style="margin-bottom:24px">${msg}</p>
        <button class="btn" id="btnRestartTest" style="margin:0 auto">↺ Repetir teste</button>
      </div>`;
  }
  if (!testState.running) {
    const p = groupPool(currentTheme);
    if (!p.length) {
      return `<div class="card center-card"><p class="translation">Este tema ainda não tem frases suficientes para um teste. Adiciona algumas em ➕ Adicionar, ou escolhe outro tema.</p></div>`;
    }
    return `
      <div class="card center-card">
        ${groupNoteHtml(currentTheme)}
        <p class="translation">${progress.history.length === 0 ? "Ainda não fizeste nenhum teste." : `Testes feitos: ${progress.history.length}`}</p>
        <p class="translation" style="margin-bottom:24px">Faz quantos testes quiseres, quando quiseres — é só para veres o teu progresso.</p>
        <button class="btn" id="btnStartTest" style="margin:0 auto">Começar teste →</button>
      </div>`;
  }
  const item = testState.set[testState.idx];
  if (!testState.currentOptions) testState.currentOptions = optionsForTest(item, testState.pool || testState.set);
  const optsHtml = testState.currentOptions.map(opt => {
    const isCorrect = opt === item.answer;
    const isSelected = opt === testState.selected;
    let cls = "opt-btn";
    if (testState.selected) {
      if (isCorrect) cls += " correct";
      else if (isSelected) cls += " wrong";
      else cls += " dim";
    }
    return `<button class="${cls}" data-opt="${opt}">${opt}${testState.selected && isCorrect ? " ✓" : ""}${testState.selected && isSelected && !isCorrect ? " ✗" : ""}</button>`;
  }).join("");
  return `
    <div class="card">
      <p class="card-label mono">pergunta ${testState.idx + 1} de ${testState.set.length}</p>
      <p class="sentence display">${item.blank}</p>
      <p class="translation">${item.pt}</p>
      <div class="options">${optsHtml}</div>
      ${testState.selected ? `<div class="gloss-block">${testState.currentOptions.map(o => `<p class="gloss-line"><b>${o}</b> — ${glossFor(o) || "significado não disponível"}</p>`).join("")}</div>` : ""}
      ${testState.selected ? `<button class="btn next" id="btnTestNext" style="margin-top:20px">${testState.idx + 1 < testState.set.length ? "Próxima" : "Ver resultado"} →</button>` : ""}
    </div>`;
}

      document.querySelectorAll('#wordPool [data-tile]').forEach(b => {

        const target = exMode === "listenTranslate" ? item.pt : fullSentence(item);
        const userSentence = buildAnswer.map(t => t.text).join(" ");
        const correct = userSentence.toLowerCase() === target.toLowerCase();

        if (correct) {

      const sentenceEl = document.getElementById("addSentence");
      const answerEl = document.getElementById("addAnswer");
      const query = (ptEl.value || "").trim().toLowerCase();
      hintEl.style.display = "block";
      if (!query) {
        hintEl.textContent = "Escreve primeiro a frase ou palavra em português acima.";
        return;
      }
      // 1) frase inteira: procura um item cujo .pt seja igual/semelhante
      const bySentence = allItems().find(i => i.pt && i.pt.toLowerCase() === query);
      // 2) palavra isolada: procura no glossário reverso (pt -> norueguês)
      let byWord = null;
      if (!bySentence) {
        for (const key in GLOSS) {
          const meanings = GLOSS[key].split("/").map(s => s.trim().toLowerCase());
          if (meanings.includes(query)) { byWord = key; break; }
        }
      }
      if (bySentence) {
        sentenceEl.value = bySentence.blank;
