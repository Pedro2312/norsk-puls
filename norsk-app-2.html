<script>
window.storage = {
  get: async function(key, shared) {
    try {
      var raw = localStorage.getItem("norsk_" + key);
      if (raw === null) return null;
      return { key: key, value: raw, shared: !!shared };
    } catch (e) { return null; }
  },
  set: async function(key, value, shared) {
    try {
      localStorage.setItem("norsk_" + key, value);
      return { key: key, value: value, shared: !!shared };
    } catch (e) { return null; }
  },
  delete: async function(key, shared) {
    try {
      localStorage.removeItem("norsk_" + key);
      return { key: key, deleted: true, shared: !!shared };
    } catch (e) { return null; }
  },
  list: async function(prefix, shared) {
    try {
      var p = "norsk_" + (prefix || "");
      var keys = Object.keys(localStorage).filter(function(k) { return k.indexOf(p) === 0; }).map(function(k) { return k.slice(6); });
      return { keys: keys, prefix: prefix, shared: !!shared };
    } catch (e) { return null; }
  },
};
</script>
